<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>Starsector 2 - Property Printer (v72)</title>
    <script src='https://cjrtnc.leaningtech.com/4.3/loader.js'></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        #log { background: #111; padding: 15px; height: 600px; overflow-y: auto; text-align: left; font-family: monospace; font-size: 12px; border-left: 4px solid #00ff88; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Starsector 2 - Property Printer</h1>
        <button id='startBtn' style="padding: 15px 30px; font-size: 18px;">🔍 PRINT PROPERTIES</button>
        <div id='log'></div>
    </div>

    <script>
        function log(m, color = '#fff') {
            const l = document.getElementById('log');
            if (l) {
                const entry = document.createElement('div');
                entry.style.color = color;
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${m}`;
                l.appendChild(entry);
                l.scrollTop = l.scrollHeight;
            }
            console.log(m);
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            log('Initializing CheerpJ...', '#00d9ff');
            try {
                await cheerpjInit({ 
                    version: 17,
                    javaProperties: [
                        `-Djava.library.path=/app/starsectorquick/build/final/wasm-modules/`,
                        `-Duser.dir=/files/`,
                        `-Dcom.fs.starfarer.settings.linux=true`
                    ],
                    mounts: [
                        { type: 'http', path: '/app/', url: 'https://adybag14-cyber.github.io/' },
                        { type: 'http', path: '/files/', url: 'https://adybag14-cyber.github.io/starsectorquick/starsector/starsector/' }
                    ]
                });

                const jarFiles = ['stubs.jar'];
                const cp = jarFiles.map(j => '/app/starsectorquick/jars/' + j).join(':');
                log('ClassPath: ' + cp);

                log('Starting PropertyPrinter...', '#ff9f43');
                await cheerpjRunMain('PropertyPrinter', cp);
                log('Done.');
            } catch (e) {
                log(`ERROR: ${e.message}`, '#ff4444');
            }
        });
    </script>
</body>
</html>
