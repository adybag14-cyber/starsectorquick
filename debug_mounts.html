<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>CheerpJ API Debugger</title>
    <script src='https://cjrtnc.leaningtech.com/4.2/loader.js'></script>
</head>
<body>
    <div id="log" style="font-family: monospace; white-space: pre;">[INIT] Searching for APIs...</div>
    <script>
        function log(m) {
            document.getElementById('log').textContent += m + '\n';
            console.log(m);
        }

        async function run() {
            log('Initializing CheerpJ 4.2...');
            try {
                await cheerpjInit({ version: 17 });
                log('CheerpJ initialized.');
            } catch (e) {
                log('cheerpjInit FAILED: ' + e.message);
            }

            log('Scanning window for cheerpj/cj functions:');
            const apis = [];
            for (let k in window) {
                if (k.toLowerCase().includes('cheerpj') || k.toLowerCase().startsWith('cj')) {
                    if (typeof window[k] === 'function') {
                        apis.push(k);
                    }
                }
            }
            log('Found APIs: ' + JSON.stringify(apis));

            if (typeof cheerpOS !== 'undefined') {
                log('cheerpOS is defined. Scanning cheerpOS:');
                const osApis = [];
                for (let k in cheerpOS) {
                    if (typeof cheerpOS[k] === 'function') {
                        osApis.push(k);
                    }
                }
                log('cheerpOS APIs: ' + JSON.stringify(osApis));
            }
        }
        run();
    </script>
</body>
</html>
