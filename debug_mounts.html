<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>CheerpJ API Debugger</title>
    <script src='https://cjrtnc.leaningtech.com/4.2/loader.js'></script>
</head>
<body>
    <div id="log" style="font-family: monospace; white-space: pre;">[INIT] Searching for APIs...</div>
    <script>
        function log(m) {
            document.getElementById('log').textContent += m + '\n';
            console.log(m);
        }

        async function run() {
            log('Initializing CheerpJ 4.2...');
            await cheerpjInit({ version: 17 });
            log('CheerpJ initialized.');

            // Wait for cheerpOS
            for (let i = 0; i < 10; i++) {
                if (typeof cheerpOS !== 'undefined') break;
                log('Waiting for cheerpOS...');
                await new Promise(r => setTimeout(r, 1000));
            }

            if (typeof cheerpOS !== 'undefined') {
                log('cheerpOS is defined. Scanning cheerpOS:');
                const osApis = [];
                for (let k in cheerpOS) {
                    if (typeof cheerpOS[k] === 'function') {
                        osApis.push(k);
                    }
                }
                log('cheerpOS APIs: ' + JSON.stringify(osApis.sort()));
            } else {
                log('cheerpOS is STILL undefined.');
            }
        }
        run();
    </script>
</body>
</html>
