<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>CheerpJ Path Debugger (No Loader)</title>
</head>
<body>
    <div id="log" style="font-family: monospace; white-space: pre;">[INIT] No Loader Mode...</div>
    <script>
        console.log('--- SCRIPT START ---');
        function log(m) {
            const l = document.getElementById('log');
            if (l) l.textContent += m + '\n';
            console.log(m);
        }
        log('Script is running without loader.');
    </script>
</body>
</html>
