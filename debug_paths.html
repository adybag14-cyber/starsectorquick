<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>CheerpJ Path Debugger (Stable Loader)</title>
    <script src='https://cjrtnc.leaningtech.com/loader.js'></script>
</head>
<body>
    <div id="log" style="font-family: monospace; white-space: pre;">[INIT] Stable Loader Mode...</div>
    <script>
        console.log('--- SCRIPT START ---');
        function log(m) {
            const l = document.getElementById('log');
            if (l) l.textContent += m + '\n';
            console.log(m);
        }
        async function run() {
            log('Initializing CheerpJ...');
            try {
                await cheerpjInit({ version: 8 });
                log('CheerpJ initialized.');
                log('cheerpOS status: ' + (typeof cheerpOS !== 'undefined' ? 'Defined' : 'UNDEFINED'));
            } catch (e) {
                log('cheerpjInit failed: ' + e.message);
            }
        }
        run();
    </script>
</body>
</html>
