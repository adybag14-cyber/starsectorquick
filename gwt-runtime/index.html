<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Starsector GWT</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #02060a; color: #bfefff; font: 14px monospace; }
    body { display: flex; align-items: center; justify-content: center; }
    #status { position: fixed; z-index: 9; top: 0; left: 0; padding: 8px 12px; }
    #gameCanvas { display: block; margin: 0; background: #000; }
    #displayControls { position: fixed; z-index: 10; top: 8px; right: 16px; font: 13px monospace; }
    #runtimeFallback { display: block; margin-top: 6px; color: #7fd6e8; text-align: right; font-size: 11px; }
    #resolutionButton, #applyResolution { border: 1px solid #0bc9ee; color: #9eefff; background: #07131a; padding: 7px 10px; cursor: pointer; }
    #resolutionPanel { display: none; margin-top: 6px; padding: 10px; border: 1px solid #166071; background: #031016ee; }
    #resolutionPanel.open { display: block; }
    #resolutionPanel label { display: block; margin: 6px 0; }
    #resolutionPanel select, #resolutionPanel input { width: 104px; box-sizing: border-box; color: #e6fbff; background: #061016; border: 1px solid #33515c; padding: 5px; }
  </style>
</head>
<body>
  <div id="status">GWT module loading…</div>
  <div id="displayControls">
    <button id="resolutionButton" type="button" aria-expanded="false">RESOLUTION</button>
    <div id="resolutionPanel">
      <label>Render resolution
        <select id="resolutionPreset">
          <option value="1024x768">1024 × 768</option>
          <option value="1280x720">1280 × 720</option>
          <option value="1600x900">1600 × 900</option>
          <option value="1920x1080">1920 × 1080</option>
          <option value="2560x1440">2560 × 1440</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <label>Custom size
        <input id="resolutionWidth" type="number" min="640" max="3840" value="1024" aria-label="Render width">
        ×
        <input id="resolutionHeight" type="number" min="360" max="2160" value="768" aria-label="Render height">
      </label>
      <button id="applyResolution" type="button">APPLY</button>
    </div>
    <a id="runtimeFallback" href="../launch.html?manual=1" title="Use the persistence-compatible runtime">CheerpJ persistent-save fallback</a>
  </div>
  <canvas id="gameCanvas" width="1024" height="768"></canvas>
  <script>
    window.__gwtGate = { errors: [], logs: [], startedAt: performance.now() };
    window.addEventListener('error', event => {
      window.__gwtGate.errors.push(String(event.error && event.error.stack || event.message));
      document.getElementById('status').textContent = 'Runtime error: ' + event.message;
    });
    for (const level of ['log', 'warn', 'error']) {
      const original = console[level].bind(console);
      console[level] = (...args) => {
        const text = args.map(String).join(' ');
        window.__gwtGate.logs.push({ level, text });
        if (text.includes('[gwt-stage] state-enter:')) {
          const status = document.getElementById('status');
          status.hidden = true;
          status.textContent = '';
        }
        original(...args);
      };
    }
    const resolutionStorageKey = 'starsectorquick.renderResolution.v1';
    const clampResolution = (value, min, max) => Math.max(min, Math.min(max, Math.round(Number(value) || min)));
    let renderResolution = { width: 1024, height: 768 };
    try { renderResolution = { ...renderResolution, ...JSON.parse(localStorage.getItem(resolutionStorageKey) || 'null') }; } catch (_) {}
    renderResolution.width = clampResolution(renderResolution.width, 640, 3840);
    renderResolution.height = clampResolution(renderResolution.height, 360, 2160);
    const resolutionButton = document.getElementById('resolutionButton');
    const resolutionPanel = document.getElementById('resolutionPanel');
    const resolutionWidth = document.getElementById('resolutionWidth');
    const resolutionHeight = document.getElementById('resolutionHeight');
    const resolutionPreset = document.getElementById('resolutionPreset');
    const gameCanvas = document.getElementById('gameCanvas');
    const fitCanvasToViewport = () => {
      const viewportWidth = Math.max(1, document.documentElement.clientWidth || window.innerWidth || 1);
      const viewportHeight = Math.max(1, document.documentElement.clientHeight || window.innerHeight || 1);
      const internalWidth = Math.max(1, gameCanvas.width || renderResolution.width);
      const internalHeight = Math.max(1, gameCanvas.height || renderResolution.height);
      const scale = Math.min(viewportWidth / internalWidth, viewportHeight / internalHeight);
      const cssWidth = Math.max(1, Math.floor(internalWidth * scale));
      const cssHeight = Math.max(1, Math.floor(internalHeight * scale));
      gameCanvas.style.width = `${cssWidth}px`;
      gameCanvas.style.height = `${cssHeight}px`;
      window.__starsectorCanvasFit = {
        viewportWidth, viewportHeight, internalWidth, internalHeight,
        cssWidth, cssHeight, scale,
        widthUtilization: cssWidth / viewportWidth,
        heightUtilization: cssHeight / viewportHeight
      };
    };
    let canvasFitPending = false;
    const scheduleCanvasFit = () => {
      if (canvasFitPending) return;
      canvasFitPending = true;
      requestAnimationFrame(() => {
        canvasFitPending = false;
        fitCanvasToViewport();
      });
    };
    new MutationObserver(scheduleCanvasFit).observe(gameCanvas, {
      attributes: true,
      attributeFilter: ['width', 'height']
    });
    window.addEventListener('resize', scheduleCanvasFit);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleCanvasFit);
    window.__starsectorFitCanvas = fitCanvasToViewport;
    const updateResolutionControls = () => {
      resolutionWidth.value = renderResolution.width;
      resolutionHeight.value = renderResolution.height;
      const key = `${renderResolution.width}x${renderResolution.height}`;
      resolutionPreset.value = [...resolutionPreset.options].some(option => option.value === key) ? key : 'custom';
      resolutionButton.textContent = `RESOLUTION · ${renderResolution.width}×${renderResolution.height}`;
    };
    resolutionButton.addEventListener('click', () => {
      const open = !resolutionPanel.classList.contains('open');
      resolutionPanel.classList.toggle('open', open);
      resolutionButton.setAttribute('aria-expanded', String(open));
    });
    resolutionPreset.addEventListener('change', () => {
      const match = resolutionPreset.value.match(/^(\d+)x(\d+)$/);
      if (match) { resolutionWidth.value = match[1]; resolutionHeight.value = match[2]; }
    });
    document.getElementById('applyResolution').addEventListener('click', () => {
      renderResolution = {
        width: clampResolution(resolutionWidth.value, 640, 3840),
        height: clampResolution(resolutionHeight.value, 360, 2160)
      };
      localStorage.setItem(resolutionStorageKey, JSON.stringify(renderResolution));
      location.reload();
    });
    updateResolutionControls();
    scheduleCanvasFit();
  </script>
  <script src="starfarer/starfarer.nocache.js"></script>
</body>
</html>
