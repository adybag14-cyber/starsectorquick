name: Current fixed-seed same-runner A/B

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-perf-same-runner
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Use Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch exact comparison refs
        run: |
          set -euo pipefail
          git fetch origin \
            refs/heads/diag/fractal-fixed-seed-baseline-current:refs/remotes/origin/diag/fractal-fixed-seed-baseline-current \
            refs/heads/diag/fractal-fixed-seed-current:refs/remotes/origin/diag/fractal-fixed-seed-current \
            refs/heads/diag/xstream-fast-id-fixed-seed:refs/remotes/origin/diag/xstream-fast-id-fixed-seed \
            refs/heads/diag/xstream-pathtracker-fixed-seed:refs/remotes/origin/diag/xstream-pathtracker-fixed-seed
          git rev-parse origin/diag/fractal-fixed-seed-baseline-current
          git rev-parse origin/diag/fractal-fixed-seed-current
          git rev-parse origin/diag/xstream-fast-id-fixed-seed
          git rev-parse origin/diag/xstream-pathtracker-fixed-seed

      - name: Restore official release cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/starsector_linux-0.98a-RC8.zip
          key: starsector-linux-0.98a-RC8-${{ hashFiles('ci/restore-official-runtime-assets.py') }}

      - name: Ensure official 0.98a-RC8 archive
        run: |
          set -euo pipefail
          mkdir -p .ci-cache
          archive=.ci-cache/starsector_linux-0.98a-RC8.zip
          if [[ ! -s "$archive" ]] || ! unzip -tq "$archive" >/dev/null 2>&1; then
            rm -f "$archive"
            curl -fL --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 1200 \
              --connect-timeout 30 --max-time 900 --continue-at - \
              -o "$archive" \
              https://f005.backblazeb2.com/file/fractalsoftworks/release/starsector_linux-0.98a-RC8.zip
          fi
          unzip -tq "$archive"
          test "$(wc -c < "$archive")" -gt 200000000

      - name: Baseline A
        run: bash ci/run-current-perf-ab-variant.sh baseline-a origin/diag/fractal-fixed-seed-baseline-current

      - name: Fractal candidate
        run: bash ci/run-current-perf-ab-variant.sh fractal origin/diag/fractal-fixed-seed-current

      - name: Fast ID candidate
        run: bash ci/run-current-perf-ab-variant.sh fast-id origin/diag/xstream-fast-id-fixed-seed

      - name: PathTracker candidate
        run: bash ci/run-current-perf-ab-variant.sh pathtracker origin/diag/xstream-pathtracker-fixed-seed

      - name: Baseline B
        run: bash ci/run-current-perf-ab-variant.sh baseline-b origin/diag/fractal-fixed-seed-baseline-current

      - name: Summarize drift-adjusted timings
        if: always()
        run: python3 ci/summarize-current-perf-ab.py

      - name: Upload same-runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-fixed-seed-same-runner-ab
          path: test_output/current-perf-ab
          if-no-files-found: error
