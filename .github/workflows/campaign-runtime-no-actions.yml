name: Campaign runtime no-actions diagnostic
# Retrigger marker after the resolved August 2026 GitHub Actions webhook incident.

on:
  pull_request:
    branches:
      - feature/starsector-webgl-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campaign-runtime-no-actions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    name: campaign worker/title-guard diagnostic
    if: github.event_name != 'pull_request' || github.head_ref != 'diag/immediate-stable-attrib-enable-frame-tail-ab'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without Marketplace actions
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach FETCH_HEAD
          git lfs install --local

      - name: Verify preinstalled toolchain
        run: |
          set -euo pipefail
          java -version
          javac -version
          node --version
          npm --version
          git lfs version

      - name: Run strict CheerpJ campaign diagnostic
        env:
          EXPERIMENT_CONFIG: '{}'
          CHEERPJ_JAVA_VERSION: '17'
          # Hot WebGL canvases can keep Playwright screenshot capture busy for
          # more than the 12s default even when gameplay/input are healthy.
          # Keep the strict visual gate, but give both locator and viewport
          # fallback captures enough time to complete under CI load.
          STARSECTOR_SCREENSHOT_TIMEOUT_MS: '30000'
        run: |
          set +e

          TITLE_CLASS='com/fs/starfarer/TitleScreenState.class'
          TITLE_JAR=''
          for candidate in jars/starfarer_obf.jar jars/starfarer.api.jar; do
            if jar tf "$candidate" 2>/dev/null | grep -Fxq "$TITLE_CLASS"; then
              TITLE_JAR="$candidate"
              break
            fi
          done
          echo "diagnostic TitleScreenState owner=${TITLE_JAR:-not-found}"

          # This check now exercises the same full-stock public path as production.
          # Do not reintroduce the historical minimal-Asharu/partial-world shortcut:
          # Fixer correctly refuses to transition a campaign with only a few markets.

          mkdir -p test_output/campaign-direct-main-thread-java17
          (
            while [[ ! -f test_output/campaign-direct-main-thread-java17/browser-live.log ]]; do
              sleep 1
            done
            tail -n +1 -F test_output/campaign-direct-main-thread-java17/browser-live.log 2>/dev/null \
              | grep --line-buffered -E 'CampaignCreateDiag|CampaignFleetCtorDiag|CampaignEconomyDiag|CoreLifecycleDiag|BrowserSectorGenDiag|BrowserSectorAnchorDiag|campaign create worker|stage=invoke-create|invoke-create-return|watcher state=|Title Screen State|Campaign State|NullPointerException|Exception|FATAL|Fatal|direct-new-game|pre-invoke|create lease|synthetic readiness|minimal fallback market'
          ) &
          stream_pid=$!

          bash ci/run-campaign-experiment.sh \
            'campaign-direct-main-thread-java17' \
            'sync' \
            'false' \
            'campaign' \
            "$EXPERIMENT_CONFIG"
          status=$?
          if [[ "$status" -eq 0 ]]; then
            python3 ci/verify-full-campaign-map.py \
              test_output/campaign-direct-main-thread-java17/browser.log \
              --expected-sector-size normal \
              --expected-start-location Galatia \
              --require-tutorial || status=$?
          fi

          kill "$stream_pid" 2>/dev/null || true
          wait "$stream_pid" 2>/dev/null || true

          echo '=== strict result.json ==='
          cat test_output/campaign-direct-main-thread-java17/result.json 2>/dev/null || true
          echo '=== campaign create / state chronology ==='
          grep -nE \
            'CampaignCreateDiag|CampaignFleetCtorDiag|CampaignEconomyDiag|CoreLifecycleDiag|BrowserSectorGenDiag|BrowserSectorAnchorDiag|campaign create worker|stage=invoke-create|invoke-create-return|watcher state=|Campaign State|NullPointerException|Exception|FATAL|Fatal|direct-new-game|pre-invoke|create lease|synthetic readiness|minimal fallback market' \
            test_output/campaign-direct-main-thread-java17/browser.log 2>/dev/null | tail -n 900 || true
          echo '=== browser log tail ==='
          tail -n 300 test_output/campaign-direct-main-thread-java17/browser.log 2>/dev/null || true
          echo "strict_campaign_exit_status=${status}"
          exit "$status"
