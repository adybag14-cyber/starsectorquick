name: Diagnose campaign render

on:
  workflow_dispatch:
  push:
    branches:
      - feature/starsector-webgl-integration
    paths:
      - '.github/workflows/diagnose-campaign-render.yml'
      - 'tools/ci/**'
  pull_request:
    branches:
      - feature/starsector-webgl-integration

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build repaired sync candidate
        shell: bash
        run: |
          set -euxo pipefail
          dst=/tmp/starsector-sync
          rm -rf "$dst"
          mkdir -p "$dst"
          cp -a "$GITHUB_WORKSPACE/." "$dst/"
          python3 "$GITHUB_WORKSPACE/tools/ci/prepare_candidate.py" --root "$dst" --swap sync | tee /tmp/prepare-sync.log

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium and Pillow
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --user pillow

      - name: Run repaired campaign candidate
        shell: bash
        run: |
          set -u
          out="$GITHUB_WORKSPACE/ci-results/sync"
          mkdir -p "$out"
          python3 "$GITHUB_WORKSPACE/tools/ci/range_server.py" --root /tmp/starsector-sync --port 4173 >"$out/server.log" 2>&1 &
          server_pid=$!
          sleep 2
          timeout 220s node "$GITHUB_WORKSPACE/tools/ci/verify_campaign.mjs" "http://127.0.0.1:4173/launch.html?autostart=1" "$out" 180000 >"$out/runner.log" 2>&1
          rc=$?
          echo "node exit=$rc" | tee -a "$out/runner.log"
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          cat "$out/result.json" 2>/dev/null || true
          echo '--- key logs ---'
          grep -E 'WebRuntimeCompat|Bridge Display\.update|\[SWAP\]|Campaign State|direct new-game|RESULT_JSON|pageerror|Runtime failure|NullPointerException|particlealpha|%EF%BB%BF' "$out/console.log" 2>/dev/null | tail -n 240 || true
          exit 0

      - name: Measure game screenshot
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          result_path = Path('ci-results/sync/result.json')
          result = json.loads(result_path.read_text()) if result_path.exists() else {}
          image_path = Path('ci-results/sync/game.png')
          image_stats = None
          if image_path.exists():
              im = Image.open(image_path).convert('RGB')
              if im.width > 8 and im.height > 8:
                  im = im.crop((4, 4, im.width - 4, im.height - 4))
              pixels = list(im.getdata())
              total = max(1, len(pixels))
              nonblack = sum(1 for r, g, b in pixels if max(r, g, b) > 8)
              bright = sum(1 for r, g, b in pixels if max(r, g, b) > 32)
              image_stats = {
                  'width': im.width,
                  'height': im.height,
                  'nonblack_ratio': nonblack / total,
                  'bright_ratio': bright / total,
                  'extrema': im.getextrema(),
              }
          result['image'] = image_stats
          Path('ci-results/summary.json').write_text(json.dumps({'sync': result}, indent=2))
          print(json.dumps({'sync': result}, indent=2))
          PY

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: campaign-render-diagnostics
          path: |
            ci-results
            /tmp/prepare-sync.log
          if-no-files-found: warn
          retention-days: 7
