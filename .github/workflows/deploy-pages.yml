name: Publish campaign runtime to Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campaign-pages-publish
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout default campaign branch
        uses: actions/checkout@v4
        with:
          ref: feature/starsector-webgl-integration
          fetch-depth: 0
          lfs: false

      - name: Capture checked-out source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache official Starsector release
        uses: actions/cache@v4
        with:
          path: .ci-cache/starsector_linux-0.98a-RC8.zip
          key: starsector-linux-0.98a-RC8-${{ hashFiles('ci/restore-official-runtime-assets.py') }}

      - name: Build verified web compatibility runtime
        env:
          CHEERPJ_JAVA_VERSION: '17'
          STARSECTOR_PREPARE_ONLY: 'true'
        run: bash ci/run-campaign-experiment.sh 'pages-build' 'sync' 'false' 'campaign' '{}'

      - name: Prepare non-destructive Pages overlay
        run: |
          python3 ci/prepare-pages-overlay.py \
            --output test_output/pages-overlays/deploy \
            --profile full-stock-campaign \
            --source-sha "${{ steps.source.outputs.sha }}"
          test -s test_output/pages-overlays/deploy/web-runtime-profile.json
          grep -q '"profile": "full-stock-campaign"' test_output/pages-overlays/deploy/web-runtime-profile.json
          test -s test_output/pages-overlays/deploy/launch.html
          grep -Fq 'id="resolutionPreset"' test_output/pages-overlays/deploy/launch.html
          grep -Fq "id='settingsBtn'" test_output/pages-overlays/deploy/launch.html
          grep -Fq '640x360' test_output/pages-overlays/deploy/launch.html
          grep -Fq 'RESOLUTION' test_output/pages-overlays/deploy/launch.html
          grep -Fq 'LWJGL_FRAME_TIMING_RING_V1' test_output/pages-overlays/deploy/build/final/wasm-modules/lwjgl.js
          test -s test_output/pages-overlays/deploy/jars/fixer_patch.jar
          test -s test_output/pages-overlays/deploy/jars/bridge.jar
          test -s test_output/pages-overlays/deploy/jars/starfarer.api.jar
          test -s test_output/pages-overlays/deploy/jars/starfarer_obf.jar
          test -s test_output/pages-overlays/deploy/jars/scripts-precompiled.jar
          grep -Fq '"devMode":true' test_output/pages-overlays/deploy/data/config/settings.json
          grep -Fq '"enableMemoryLeakChecking":false' test_output/pages-overlays/deploy/data/config/settings.json
          grep -Fq '"devMode":true' test_output/pages-overlays/deploy/resources/settings.json
          grep -Fq '"devMode":true' test_output/pages-overlays/deploy/starsector/starsector/data/config/settings.json
          grep -Fq '"enableMemoryLeakChecking":false' test_output/pages-overlays/deploy/starsector/starsector/data/config/settings.json
          grep -Fq '"devMode":true' test_output/pages-overlays/deploy/starsector/starsector/settings.json

      - name: Publish overlay to gh-pages
        id: publish
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf .pages-worktree
          # gh-pages still contains historical LFS-tracked payloads. Preserve their
          # pointers while checking out the deployment worktree; the verified overlay
          # replaces every runtime file needed by the live site and must not depend on
          # the repository owner's LFS download quota.
          GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach .pages-worktree origin/gh-pages
          cp -a test_output/pages-overlays/deploy/. .pages-worktree/
          touch .pages-worktree/.nojekyll
          # Collapse the final combined Starsector data tree into one immutable payload.
          # The service worker serves byte ranges from this pack, avoiding thousands of
          # latency-bound GitHub Pages filesystem requests on a cold launch.
          python3 ci/build-pages-data-pack.py --root .pages-worktree
          test -s .pages-worktree/starsector-data-pack-v1.bin
          test -s .pages-worktree/starsector-data-pack-v1.json
          # Pack the exact individual JAR byte streams too. The service worker
          # reconstructs their original URLs/ranges locally for CheerpJ.
          python3 ci/build-pages-jar-pack.py --root .pages-worktree
          test -s .pages-worktree/starsector-jar-pack-v1.bin
          test -s .pages-worktree/starsector-jar-pack-v1.json
          python3 ci/build-pages-graphics-packs.py --root .pages-worktree
          test -s .pages-worktree/starsector-graphics-pack-v1.json
          test -d .pages-worktree/starsector-graphics-pack-v1
          test -s .pages-worktree/starsector-graphics-pack-v1/planets.bin
          test -s .pages-worktree/starsector-graphics-pack-v1/ships.bin
          SOURCE_SHA="${{ steps.source.outputs.sha }}"
          git -C .pages-worktree config user.name 'github-actions[bot]'
          git -C .pages-worktree config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The overlay may contain intentionally ignored runtime binaries such as
          # newly generated JARs. This worktree starts clean from gh-pages, so force
          # staging is limited to the verified overlay copied above.
          git -C .pages-worktree add -f -A
          # Official Starsector data/source files intentionally retain their upstream whitespace.
          # Lint only deployment control/generated files; mutating stock data to satisfy Git
          # whitespace rules would change the byte-faithful runtime payload.
          git -C .pages-worktree diff --cached --check -- . \
            ':(exclude)data/**' \
            ':(exclude)starsector/starsector/data/**'
          if git -C .pages-worktree diff --cached --name-status | grep -q '^D'; then
            echo 'Refusing Pages overlay that deletes existing deployed files.' >&2
            git -C .pages-worktree diff --cached --name-status >&2
            exit 1
          fi
          if git -C .pages-worktree diff --cached --quiet; then
            echo 'Pages overlay already matches gh-pages.'
          else
            git -C .pages-worktree commit -m "Deploy campaign runtime ${SOURCE_SHA::12}"
            git -C .pages-worktree push origin HEAD:gh-pages
          fi
          echo "deploy_sha=$(git -C .pages-worktree rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub Pages to serve this source revision
        env:
          LIVE_PROFILE_URL: 'https://adybag14-cyber.github.io/starsectorquick/web-runtime-profile.json'
          SOURCE_SHA: '${{ steps.source.outputs.sha }}'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            body="$(curl -fsS -H 'Cache-Control: no-cache' "${LIVE_PROFILE_URL}?source=${SOURCE_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$body" | grep -Fq "${SOURCE_SHA}"; then
              echo "GitHub Pages is serving source ${SOURCE_SHA}."
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for GitHub Pages to publish ${SOURCE_SHA}." >&2
          exit 1

      - name: Verify live runtime settings
        env:
          LIVE_BASE_URL: 'https://adybag14-cyber.github.io/starsectorquick'
          SOURCE_SHA: '${{ steps.source.outputs.sha }}'
        run: |
          set -euo pipefail
          check_setting() {
            path="$1"
            shift
            body="$(curl -fsS -H 'Cache-Control: no-cache' "${LIVE_BASE_URL}/${path}?source=${SOURCE_SHA}")"
            for marker in "$@"; do
              if [[ "$body" != *"$marker"* ]]; then
                echo "Live runtime setting mismatch: ${path} missing ${marker}" >&2
                exit 1
              fi
            done
          }
          check_setting data/config/settings.json '"devMode":true' '"enableMemoryLeakChecking":false'
          check_setting resources/settings.json '"devMode":true'
          check_setting starsector/starsector/data/config/settings.json '"devMode":true' '"enableMemoryLeakChecking":false'
          check_setting starsector/starsector/settings.json '"devMode":true'
          check_setting build/final/wasm-modules/lwjgl.js 'LWJGL_FRAME_TIMING_RING_V1' '__lwjglRefreshPresentationStats'

      - name: Verify live resolution controls are published
        env:
          LIVE_LAUNCH_URL: 'https://adybag14-cyber.github.io/starsectorquick/launch.html'
          SOURCE_SHA: '${{ steps.source.outputs.sha }}'
        run: |
          set -euo pipefail
          body="$(curl -fsS -H 'Cache-Control: no-cache' "${LIVE_LAUNCH_URL}?source=${SOURCE_SHA}")"
          for marker in 'id="resolutionPreset"' "id='settingsBtn'" '640x360' 'RESOLUTION'; do
            if [[ "$body" != *"$marker"* ]]; then
              echo "Live launcher is missing resolution marker: ${marker}" >&2
              exit 1
            fi
          done

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify source and live resolution interaction
        run: |
          node ci/verify-launch-resolution-ui.js
          STARSECTOR_RESOLUTION_TEST_URL='https://adybag14-cyber.github.io/starsectorquick/launch.html' \
            node ci/verify-launch-resolution-ui.js

      - name: Verify live mature campaign gameplay from clean browser state
        env:
          STARSECTOR_TEST_URL: 'https://adybag14-cyber.github.io/starsectorquick/launch.html'
          STARSECTOR_TEST_TIMEOUT_MS: '720000'
          STARSECTOR_FRAME_SETTLE_MS: '30000'
          STARSECTOR_EXPECT_STATE: 'campaign'
          STARSECTOR_DEEP_GAMEPLAY: 'true'
          STARSECTOR_MIN_RECENT_FPS: '8'
          STARSECTOR_MAX_FRAME_P95_MS: '150'
          STARSECTOR_MAX_FRAME_P99_MS: '220'
          STARSECTOR_MAX_JITTER_P95_MS: '60'
          STARSECTOR_TEST_OUTPUT_DIR: 'test_output/pages-live'
        run: |
          node ci/campaign-render-test.js
          python3 ci/verify-full-campaign-map.py test_output/pages-live/browser.log \
            --expected-sector-size normal \
            --expected-start-location Corvus

      - name: Verify live public tutorial starts from a clean browser state
        env:
          STARSECTOR_TEST_URL: 'https://adybag14-cyber.github.io/starsectorquick/launch.html'
          STARSECTOR_TEST_TIMEOUT_MS: '720000'
          STARSECTOR_FRAME_SETTLE_MS: '5000'
          STARSECTOR_SCREENSHOT_TIMEOUT_MS: '30000'
          STARSECTOR_EXPECT_STATE: 'campaign'
          STARSECTOR_TEST_OUTPUT_DIR: 'test_output/pages-tutorial'
        run: |
          node ci/campaign-render-test.js
          python3 ci/verify-full-campaign-map.py test_output/pages-tutorial/browser.log \
            --expected-sector-size normal \
            --expected-start-location Galatia \
            --require-tutorial

      - name: Upload live Pages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-campaign-evidence
          path: |
            test_output/pages-live
            test_output/pages-tutorial
            test_output/pages-build
            test_output/pages-overlays/deploy/web-runtime-profile.json
            test_output/pages-overlays/deploy/web-runtime-manifest.json
          if-no-files-found: warn
