name: Publish campaign runtime to Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campaign-pages-publish
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout default campaign branch
        uses: actions/checkout@v4
        with:
          ref: feature/starsector-webgl-integration
          fetch-depth: 0
          lfs: false

      - name: Capture checked-out source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache official Starsector release
        uses: actions/cache@v4
        with:
          path: .ci-cache/starsector_linux-0.98a-RC8.zip
          key: starsector-linux-0.98a-RC8-${{ hashFiles('ci/restore-official-runtime-assets.py') }}

      - name: Build verified web compatibility runtime
        env:
          CHEERPJ_JAVA_VERSION: '17'
          STARSECTOR_MINIMAL_CORVUS_ASHARU_ANCHOR: 'true'
          STARSECTOR_MINIMAL_ASHARU_ECONOMY: 'true'
          STARSECTOR_PREPARE_ONLY: 'true'
        run: bash ci/run-campaign-experiment.sh 'pages-build' 'sync' 'false' 'campaign' '{}'

      - name: Prepare non-destructive Pages overlay
        run: |
          python3 ci/prepare-pages-overlay.py \
            --output test_output/pages-overlays/deploy \
            --profile corvus-asharu-compat \
            --source-sha "${{ steps.source.outputs.sha }}"
          test -s test_output/pages-overlays/deploy/web-runtime-profile.json
          test -s test_output/pages-overlays/deploy/jars/fixer_patch.jar
          test -s test_output/pages-overlays/deploy/jars/starfarer.api.jar
          test -s test_output/pages-overlays/deploy/jars/starfarer_obf.jar
          test -s test_output/pages-overlays/deploy/jars/scripts-precompiled.jar

      - name: Publish overlay to gh-pages
        id: publish
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf .pages-worktree
          git worktree add --detach .pages-worktree origin/gh-pages
          cp -a test_output/pages-overlays/deploy/. .pages-worktree/
          rm -f .pages-worktree/.starsectorquick-pages-overlay
          touch .pages-worktree/.nojekyll
          SOURCE_SHA="${{ steps.source.outputs.sha }}"
          git -C .pages-worktree config user.name 'github-actions[bot]'
          git -C .pages-worktree config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The overlay may contain intentionally ignored runtime binaries such as
          # newly generated JARs. This worktree starts clean from gh-pages, so force
          # staging is limited to the verified overlay copied above.
          git -C .pages-worktree add -f -A
          git -C .pages-worktree diff --cached --check
          if git -C .pages-worktree diff --cached --name-status | grep -q '^D'; then
            echo 'Refusing Pages overlay that deletes existing deployed files.' >&2
            git -C .pages-worktree diff --cached --name-status >&2
            exit 1
          fi
          if git -C .pages-worktree diff --cached --quiet; then
            echo 'Pages overlay already matches gh-pages.'
          else
            git -C .pages-worktree commit -m "Deploy campaign runtime ${SOURCE_SHA::12}"
            git -C .pages-worktree push origin HEAD:gh-pages
          fi
          echo "deploy_sha=$(git -C .pages-worktree rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub Pages to serve this source revision
        env:
          LIVE_PROFILE_URL: 'https://adybag14-cyber.github.io/starsectorquick/web-runtime-profile.json'
          SOURCE_SHA: '${{ steps.source.outputs.sha }}'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            body="$(curl -fsS -H 'Cache-Control: no-cache' "${LIVE_PROFILE_URL}?source=${SOURCE_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$body" | grep -Fq "${SOURCE_SHA}"; then
              echo "GitHub Pages is serving source ${SOURCE_SHA}."
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for GitHub Pages to publish ${SOURCE_SHA}." >&2
          exit 1

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify live campaign renders and advances from clean browser state
        env:
          STARSECTOR_TEST_URL: 'https://adybag14-cyber.github.io/starsectorquick/launch.html'
          STARSECTOR_TEST_TIMEOUT_MS: '720000'
          STARSECTOR_FRAME_SETTLE_MS: '30000'
          STARSECTOR_EXPECT_STATE: 'campaign'
          STARSECTOR_TEST_OUTPUT_DIR: 'test_output/pages-live'
        run: node ci/campaign-render-test.js

      - name: Upload live Pages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-campaign-evidence
          path: |
            test_output/pages-live
            test_output/pages-build
            test_output/pages-overlays/deploy/web-runtime-profile.json
            test_output/pages-overlays/deploy/web-runtime-manifest.json
          if-no-files-found: warn
