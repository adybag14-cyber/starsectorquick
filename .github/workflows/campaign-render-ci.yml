name: Campaign render verification

on:
  pull_request:
    branches:
      - feature/starsector-webgl-integration
  push:
    branches:
      - fix/campaign-render-main-thread
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/starsector-http.log 2>&1 &
          echo $! > /tmp/starsector-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/launch.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/starsector-http.log
          exit 1

      - name: Verify campaign renders and advances
        env:
          STARSECTOR_TEST_TIMEOUT_MS: '360000'
        run: node ci/campaign-render-test.js

      - name: Show server log
        if: always()
        run: cat /tmp/starsector-http.log || true

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-render-evidence
          path: test_output/campaign-render
          if-no-files-found: warn
