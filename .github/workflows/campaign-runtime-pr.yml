name: Campaign runtime PR matrix

on:
  pull_request:
    branches:
      - feature/starsector-webgl-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: title-sync-stock
            swap_mode: sync
            patch_sleep: 'false'
            expect_state: title
            window_config: '{"__STARSECTOR_AUTO_CAMPAIGN__":false,"__STARSECTOR_DIRECT_LAUNCH__":false}'
          - name: campaign-direct-sync-stock
            swap_mode: sync
            patch_sleep: 'false'
            expect_state: campaign
            window_config: '{"__STARSECTOR_AUTO_CAMPAIGN__":true,"__STARSECTOR_AUTO_CAMPAIGN_MODE__":"new_direct","__STARSECTOR_AUTO_CAMPAIGN_TITLE_SETTLE_MS__":5000,"__STARSECTOR_AUTO_CAMPAIGN_SKIP_DIRECT_UI_PREFLIGHT__":false,"__STARSECTOR_AUTO_CAMPAIGN_ENABLE_SYNTHETIC_PLAYER_FLEET_FALLBACK__":false,"__STARSECTOR_AUTO_CAMPAIGN_DIRECT_USE_WORKER_THREAD__":false,"__STARSECTOR_AUTO_CAMPAIGN_MUTATING_SPEC_PREFLIGHT__":false}'
          - name: campaign-menu-sync-stock
            swap_mode: sync
            patch_sleep: 'false'
            expect_state: campaign
            window_config: '{"__STARSECTOR_AUTO_CAMPAIGN__":true,"__STARSECTOR_AUTO_CAMPAIGN_MODE__":"new_menu_only","__STARSECTOR_AUTO_CAMPAIGN_TITLE_SETTLE_MS__":5000,"__STARSECTOR_AUTO_CAMPAIGN_SKIP_DIRECT_UI_PREFLIGHT__":false,"__STARSECTOR_AUTO_CAMPAIGN_ENABLE_SYNTHETIC_PLAYER_FLEET_FALLBACK__":false,"__STARSECTOR_AUTO_CAMPAIGN_MUTATING_SPEC_PREFLIGHT__":true}'
          - name: campaign-direct-raf-no-java-sleep
            swap_mode: raf
            patch_sleep: 'true'
            expect_state: campaign
            window_config: '{"__STARSECTOR_AUTO_CAMPAIGN__":true,"__STARSECTOR_AUTO_CAMPAIGN_MODE__":"new_direct","__STARSECTOR_AUTO_CAMPAIGN_TITLE_SETTLE_MS__":5000,"__STARSECTOR_AUTO_CAMPAIGN_SKIP_DIRECT_UI_PREFLIGHT__":false,"__STARSECTOR_AUTO_CAMPAIGN_ENABLE_SYNTHETIC_PLAYER_FLEET_FALLBACK__":false,"__STARSECTOR_AUTO_CAMPAIGN_DIRECT_USE_WORKER_THREAD__":false,"__STARSECTOR_AUTO_CAMPAIGN_MUTATING_SPEC_PREFLIGHT__":false}'

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build and verify ${{ matrix.name }}
        env:
          EXPERIMENT_CONFIG: ${{ matrix.window_config }}
        run: bash ci/run-campaign-experiment.sh '${{ matrix.name }}' '${{ matrix.swap_mode }}' '${{ matrix.patch_sleep }}' '${{ matrix.expect_state }}' "$EXPERIMENT_CONFIG"
      - name: Upload ${{ matrix.name }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-runtime-${{ matrix.name }}
          path: test_output/${{ matrix.name }}
          if-no-files-found: warn
