name: Campaign runtime PR matrix

on:
  pull_request:
    branches:
      - feature/starsector-webgl-integration
  workflow_dispatch:
    inputs:
      save_load_smoke:
        description: Verify the created campaign can be reloaded via Continue without creating a fallback world
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: campaign-runtime-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare runtime diagnostics
    if: github.event_name != 'pull_request' || github.head_ref != 'diag/input-query-telemetry-frame-tail-ab'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Sanitize and report missing static graphics
        run: |
          mkdir -p test_output/asset-audit test_output/bytecode .ci-cache
          python3 ci/sanitize-runtime-assets.py | tee test_output/asset-audit/asset-sanitation.log
      - name: Inspect runtime jars and campaign bytecode
        run: |
          git lfs pull --include='jars/resources.jar' --exclude=''
          bash ci/dump-campaign-bytecode.sh test_output/bytecode
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jar = Path('jars/resources.jar')
          out = Path('test_output/asset-audit')
          with ZipFile(jar) as zf:
              names = sorted(zf.namelist())
          graphics = [name for name in names if 'graphics/' in name.lower()]
          (out / 'resources-jar-all.txt').write_text('\n'.join(names) + '\n', encoding='utf-8')
          (out / 'resources-jar-graphics.txt').write_text('\n'.join(graphics) + '\n', encoding='utf-8')
          (out / 'resources-jar-summary.txt').write_text(
              f'bytes={jar.stat().st_size}\nentries={len(names)}\ngraphicsEntries={len(graphics)}\n',
              encoding='utf-8',
          )
          print((out / 'resources-jar-summary.txt').read_text(), end='')
          PY
      - name: Download official 0.98a-RC8 release
        run: |
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 1200 \
            --connect-timeout 30 --max-time 900 --continue-at - \
            -o .ci-cache/starsector_linux-0.98a-RC8.zip \
            https://f005.backblazeb2.com/file/fractalsoftworks/release/starsector_linux-0.98a-RC8.zip
          unzip -tq .ci-cache/starsector_linux-0.98a-RC8.zip
          test "$(wc -c < .ci-cache/starsector_linux-0.98a-RC8.zip)" -gt 200000000
      - name: Save official release cache
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/starsector_linux-0.98a-RC8.zip
          key: starsector-linux-0.98a-RC8-${{ hashFiles('ci/restore-official-runtime-assets.py') }}
      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-preparation-evidence
          path: |
            test_output/asset-audit
            test_output/bytecode
          if-no-files-found: warn

  experiment:
    name: campaign-direct-main-thread-java17
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Restore official release cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/starsector_linux-0.98a-RC8.zip
          key: starsector-linux-0.98a-RC8-${{ hashFiles('ci/restore-official-runtime-assets.py') }}
          fail-on-cache-miss: true
      - name: Build and verify campaign-direct-main-thread-java17
        env:
          EXPERIMENT_CONFIG: '{}'
          CHEERPJ_JAVA_VERSION: '17'
          STARSECTOR_DEEP_GAMEPLAY: 'true'
          STARSECTOR_PUBLIC_TUTORIAL_SMOKE: 'true'
          STARSECTOR_SAVE_LOAD_TIMEOUT_MS: '600000'
          STARSECTOR_SAVE_LOAD_SMOKE: ${{ inputs.save_load_smoke && 'true' || 'false' }}
        run: bash ci/run-campaign-experiment.sh 'campaign-direct-main-thread-java17' 'sync' 'false' 'campaign' "$EXPERIMENT_CONFIG"
      - name: Validate Pages overlay from verified candidate
        run: |
          python3 ci/prepare-pages-overlay.py \
            --output test_output/pages-overlays/pr-check \
            --profile full-stock-campaign \
            --source-sha "$GITHUB_SHA"
          test -s test_output/pages-overlays/pr-check/web-runtime-profile.json
          grep -q '"profile": "full-stock-campaign"' test_output/pages-overlays/pr-check/web-runtime-profile.json
          test -s test_output/pages-overlays/pr-check/jars/fixer_patch.jar
          test -s test_output/pages-overlays/pr-check/jars/starfarer.api.jar
          test -s test_output/pages-overlays/pr-check/jars/starfarer_obf.jar
          test -s test_output/pages-overlays/pr-check/jars/scripts-precompiled.jar
      - name: Upload campaign-direct-main-thread-java17 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-runtime-campaign-direct-main-thread-java17
          path: |
            test_output/campaign-direct-main-thread-java17
            test_output/campaign-direct-main-thread-java17-tutorial
            test_output/pages-overlays/pr-check/web-runtime-profile.json
            test_output/pages-overlays/pr-check/web-runtime-manifest.json
          if-no-files-found: warn


  resolution_fullhd:
    name: Full HD 1920x1080 campaign smoke
    if: github.ref_name == 'feat/custom-resolution' || github.head_ref == 'feat/custom-resolution'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Restore official release cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/starsector_linux-0.98a-RC8.zip
          key: starsector-linux-0.98a-RC8-${{ hashFiles('ci/restore-official-runtime-assets.py') }}
          fail-on-cache-miss: true
      - name: Run real 1920x1080 campaign
        env:
          CHEERPJ_JAVA_VERSION: '17'
          STARSECTOR_DEEP_GAMEPLAY: 'false'
          STARSECTOR_PUBLIC_TUTORIAL_SMOKE: 'false'
          STARSECTOR_SAVE_LOAD_SMOKE: 'false'
          STARSECTOR_SCREENSHOT_TIMEOUT_MS: '30000'
          STARSECTOR_PRE_SCREENSHOT_FRAMES: '120'
          STARSECTOR_PRE_SCREENSHOT_TIMEOUT_MS: '90000'
          EXPERIMENT_CONFIG: '{"__STARSECTOR_RENDER_WIDTH__":1920,"__STARSECTOR_RENDER_HEIGHT__":1080}'
        run: |
          set +e
          bash ci/run-campaign-experiment.sh 'resolution-fullhd' 'sync' 'false' 'campaign' "$EXPERIMENT_CONFIG"
          rc=$?
          set -e
          echo "Generic campaign harness rc=$rc; applying Full-HD-specific verifier next."
          test -s test_output/resolution-fullhd/result.json
          test -s test_output/resolution-fullhd/browser.log
      - name: Verify Full HD framebuffer and input
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('test_output/resolution-fullhd/result.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('expectedState') == 'campaign', data.get('expectedState')
          assert int(data.get('campaignSeenAt') or 0) > 0, data.get('campaignSeenAt')
          assert data.get('rendered') is True, data.get('rendered')
          assert data.get('inputResponsive') is True, data.get('inputAfter')
          assert data.get('shortcutsResponsive') is True, data.get('shortcutResults')
          assert data.get('uiControlsSafe') is True, data.get('uiControlResults')
          assert not data.get('fatalSeenAt'), data.get('fatalSeenAt')
          assert not data.get('errors'), data.get('errors')
          assert not data.get('graphicsErrors'), data.get('graphicsErrors')
          assert not data.get('runtimeErrorSignals'), data.get('runtimeErrorSignals')
          refit = next((row for row in (data.get('shortcutResults') or []) if row.get('name') == 'Refit'), None)
          assert refit and refit.get('semanticOpened') is True and not refit.get('failed'), refit
          assert float(refit.get('visualDiff') or 0) > 0.05, refit
          cfg = data.get('windowConfig') or {}
          assert int(cfg.get('__STARSECTOR_RENDER_WIDTH__', 0)) == 1920, cfg
          assert int(cfg.get('__STARSECTOR_RENDER_HEIGHT__', 0)) == 1080, cfg
          canvases = ((data.get('state') or {}).get('canvases') or [])
          assert canvases, 'no canvas telemetry'
          canvas = canvases[0]
          assert int(canvas.get('width', 0)) == 1920, canvas
          assert int(canvas.get('height', 0)) == 1080, canvas
          print('Full HD runtime verified:', canvas)
          PY
      - name: Upload Full HD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-runtime-resolution-fullhd
          path: test_output/resolution-fullhd
          if-no-files-found: warn

  frame-perf-same-runner:
    name: input query telemetry opt-out frame-tail A/B
    if: github.event_name == 'pull_request' && github.head_ref == 'diag/input-query-telemetry-frame-tail-ab'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Use Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch exact comparison refs
        run: |
          set -euo pipefail
          git fetch origin \
            refs/heads/feature/starsector-webgl-integration:refs/remotes/origin/feature/starsector-webgl-integration \
            refs/heads/perf/input-query-telemetry-optin-current:refs/remotes/origin/perf/input-query-telemetry-optin-current
          test "$(git rev-parse origin/feature/starsector-webgl-integration)" = "60e21b1fef5985f69e0de1fd39290df696a67033"
          test "$(git rev-parse origin/perf/input-query-telemetry-optin-current)" = "ab9455cc500d9e7580a4a072b748862b2f47d42d"
          test "$(git show origin/perf/input-query-telemetry-optin-current:build/final/wasm-modules/lwjgl.js | grep -Fc LWJGL_INPUT_QUERY_TELEMETRY_OPTIN_V1)" -eq 1
          test "$(git show origin/feature/starsector-webgl-integration:build/final/wasm-modules/lwjgl.js | grep -Fc LWJGL_INPUT_QUERY_TELEMETRY_OPTIN_V1)" -eq 0
      - name: Restore official release cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/starsector_linux-0.98a-RC8.zip
          key: starsector-linux-0.98a-RC8-${{ hashFiles('ci/restore-official-runtime-assets.py') }}
      - name: Ensure official 0.98a-RC8 archive
        run: |
          set -euo pipefail
          mkdir -p .ci-cache
          archive=.ci-cache/starsector_linux-0.98a-RC8.zip
          if [[ ! -s "$archive" ]] || ! unzip -tq "$archive" >/dev/null 2>&1; then
            rm -f "$archive"
            curl -fL --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 1200 \
              --connect-timeout 30 --max-time 900 --continue-at - \
              -o "$archive" \
              https://f005.backblazeb2.com/file/fractalsoftworks/release/starsector_linux-0.98a-RC8.zip
          fi
          unzip -tq "$archive"
          test "$(wc -c < "$archive")" -gt 200000000
      - name: Production baseline A
        run: bash ci/run-frame-perf-ab-variant.sh baseline-a origin/feature/starsector-webgl-integration
      - name: Input query telemetry opt-out candidate
        run: bash ci/run-frame-perf-ab-variant.sh input-query-off origin/perf/input-query-telemetry-optin-current
      - name: Production baseline B
        run: bash ci/run-frame-perf-ab-variant.sh baseline-b origin/feature/starsector-webgl-integration
      - name: Summarize drift-adjusted frame metrics
        if: always()
        run: python3 ci/summarize-frame-perf-ab.py
      - name: Upload same-runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: input-query-telemetry-frame-tail-ab
          path: test_output/frame-perf-ab
          if-no-files-found: error
