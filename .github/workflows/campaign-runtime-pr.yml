name: Campaign runtime PR matrix

on:
  pull_request:
    branches:
      - feature/starsector-webgl-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campaign-runtime-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asset-audit:
    name: static asset audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Sanitize and report missing static graphics
        run: |
          mkdir -p test_output/asset-audit
          python3 ci/sanitize-runtime-assets.py | tee test_output/asset-audit/asset-sanitation.log
      - name: Inspect resources jar for omitted graphics
        run: |
          git lfs pull --include='jars/resources.jar' --exclude=''
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jar = Path('jars/resources.jar')
          out = Path('test_output/asset-audit')
          with ZipFile(jar) as zf:
              names = sorted(zf.namelist())
          graphics = [name for name in names if 'graphics/' in name.lower()]
          (out / 'resources-jar-all.txt').write_text('\n'.join(names) + '\n', encoding='utf-8')
          (out / 'resources-jar-graphics.txt').write_text('\n'.join(graphics) + '\n', encoding='utf-8')
          (out / 'resources-jar-summary.txt').write_text(
              f'bytes={jar.stat().st_size}\nentries={len(names)}\ngraphicsEntries={len(graphics)}\n',
              encoding='utf-8',
          )
          print((out / 'resources-jar-summary.txt').read_text(), end='')
          PY
      - name: Upload asset audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-static-asset-audit
          path: test_output/asset-audit
          if-no-files-found: warn

  experiment:
    name: campaign-default-java17
    needs: asset-audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build and verify default campaign launch
        env:
          EXPERIMENT_CONFIG: '{}'
          CHEERPJ_JAVA_VERSION: '17'
        run: bash ci/run-campaign-experiment.sh 'campaign-default-java17' 'sync' 'false' 'campaign' "$EXPERIMENT_CONFIG"
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-runtime-default-java17
          path: test_output/campaign-default-java17
          if-no-files-found: warn
