        const LOG_MAX_ENTRIES = 900;
        let lastLogMessage = null;
        let lastLogEntry = null;
        let lastLogCount = 1;

        function log(m, color = '#fff') {
            const l = document.getElementById('log');
            if (l) {
                const now = new Date().toLocaleTimeString();
                const msg = String(m);
                if (lastLogEntry && lastLogMessage === msg) {
                    lastLogCount += 1;
                    lastLogEntry.textContent = `[${now}] ${msg} (x${lastLogCount})`;
                } else {
                    const entry = document.createElement('div');
                    entry.style.color = color;
                    entry.textContent = `[${now}] ${msg}`;
                    l.appendChild(entry);
                    lastLogEntry = entry;
                    lastLogMessage = msg;
                    lastLogCount = 1;
                }
                while (l.childElementCount > LOG_MAX_ENTRIES) {
                    l.removeChild(l.firstChild);
                }
                l.scrollTop = l.scrollHeight;
            }
            console.log(m);
        }

        function createInlineLwjglNatives(logFn) {
            const state = {
                gl: null,
                texById: new Map(),
                nextTexId: 1,
                vertexArrayEnabled: false
            };

            function ensureGl() {
                if (state.gl) return state.gl;
                const canvas = document.querySelector('#game-container canvas') || document.querySelector('canvas');
                if (!canvas) return null;
                state.gl = canvas.getContext('webgl2', { alpha: false, antialias: false }) ||
                           canvas.getContext('webgl', { alpha: false, antialias: false });
                if (!state.gl) logFn('Inline LWJGL bridge: failed to acquire WebGL context', '#ff8800');
                return state.gl;
            }

            function toNumber(v) {
                return typeof v === 'bigint' ? Number(v) : v;
            }

            function noThrow(fn) {
                return (...args) => {
                    try { return fn(...args); } catch (e) {
                        console.warn('Inline LWJGL native failed:', e);
                        return undefined;
                    }
                };
            }

            const n = {};

            n.Java_org_lwjgl_Sys_getTimerResolution = () => BigInt(1000);
            n.Java_org_lwjgl_Sys_getTime = () => BigInt(Math.floor(performance.now()));
            n.Java_org_lwjgl_Sys_alert = (env, cls, title, message) => {
                console.warn('[LWJGL ALERT]', String(title), String(message));
            };

            n.Java_org_lwjgl_opengl_Display_create = noThrow(() => {
                ensureGl();
            });
            n.Java_org_lwjgl_opengl_LinuxContextImplementation_nSetSwapInterval = () => {};
            n.Java_org_lwjgl_opengl_LinuxContextImplementation_nMakeCurrent = () => {};
            n.Java_org_lwjgl_opengl_LinuxContextImplementation_nIsCurrent = () => true;
            n.Java_org_lwjgl_opengl_LinuxContextImplementation_nSwapBuffers = () =>
                new Promise((resolve) => requestAnimationFrame(() => resolve()));

            n.Java_org_lwjgl_opengl_GL11_nglGetString = noThrow((env, cls, name) => {
                const p = toNumber(name);
                if (p === 7938) return '2.1';
                if (p === 7939) return 'GL_EXT_framebuffer_object GL_ARB_vertex_buffer_object';
                return '';
            });

            n.Java_org_lwjgl_opengl_GL11_nglGetIntegerv = noThrow((env, cls, pname, ptr) => {
                const p = toNumber(pname);
                const base = toNumber(ptr);
                const dv = env.getJNIDataView();
                if (p === 2978) {
                    const gl = ensureGl();
                    const w = gl ? gl.drawingBufferWidth : 1024;
                    const h = gl ? gl.drawingBufferHeight : 768;
                    dv.setInt32(base + 0, 0, true);
                    dv.setInt32(base + 4, 0, true);
                    dv.setInt32(base + 8, w, true);
                    dv.setInt32(base + 12, h, true);
                } else {
                    dv.setInt32(base, 0, true);
                }
            });

            n.Java_org_lwjgl_opengl_GL11_nglClearColor = noThrow((env, cls, r, g, b, a) => {
                const gl = ensureGl();
                if (gl) gl.clearColor(r, g, b, a);
            });

            n.Java_org_lwjgl_opengl_GL11_nglClear = noThrow((env, cls, mask) => {
                const gl = ensureGl();
                if (gl) gl.clear(toNumber(mask));
            });

            n.Java_org_lwjgl_opengl_GL11_nglViewport = noThrow((env, cls, x, y, w, h) => {
                const gl = ensureGl();
                if (gl) gl.viewport(toNumber(x), toNumber(y), toNumber(w), toNumber(h));
            });

            n.Java_org_lwjgl_opengl_GL11_nglEnable = noThrow((env, cls, cap) => {
                const gl = ensureGl();
                if (gl) gl.enable(toNumber(cap));
            });

            n.Java_org_lwjgl_opengl_GL11_nglDisable = noThrow((env, cls, cap) => {
                const gl = ensureGl();
                if (gl) gl.disable(toNumber(cap));
            });

            n.Java_org_lwjgl_opengl_GL11_nglBlendFunc = noThrow((env, cls, src, dst) => {
                const gl = ensureGl();
                if (gl) gl.blendFunc(toNumber(src), toNumber(dst));
            });

            n.Java_org_lwjgl_opengl_GL11_nglGenTextures = noThrow((env, cls, count, ptr) => {
                const gl = ensureGl();
                const dv = env.getJNIDataView();
                const c = toNumber(count);
                const base = toNumber(ptr);
                for (let i = 0; i < c; i++) {
                    const id = state.nextTexId++;
                    const tex = gl ? gl.createTexture() : null;
                    state.texById.set(id, tex);
                    dv.setInt32(base + i * 4, id, true);
                }
            });

            n.Java_org_lwjgl_opengl_GL11_nglBindTexture = noThrow((env, cls, target, texture) => {
                const gl = ensureGl();
                if (!gl) return;
                const id = toNumber(texture);
                let tex = state.texById.get(id);
                if (!tex && id > 0) {
                    tex = gl.createTexture();
                    state.texById.set(id, tex);
                }
                gl.bindTexture(toNumber(target), tex || null);
            });

            n.Java_org_lwjgl_opengl_GL11_nglTexParameteri = noThrow((env, cls, target, pname, param) => {
                const gl = ensureGl();
                if (!gl) return;
                gl.texParameteri(toNumber(target), toNumber(pname), toNumber(param));
            });

            n.Java_org_lwjgl_opengl_GL11_nglTexImage2D = noThrow((env, cls, target, level, internalFormat, width, height, border, format, type, pixelsPtr) => {
                const gl = ensureGl();
                if (!gl) return;
                const t = toNumber(target), l = toNumber(level), i = toNumber(internalFormat);
                const w = toNumber(width), h = toNumber(height), b = toNumber(border);
                const f = toNumber(format), ty = toNumber(type), p = toNumber(pixelsPtr);
                let data = null;
                if (p > 0 && ty === gl.UNSIGNED_BYTE) {
                    const comps = (f === gl.RGB || f === 6407) ? 3 : 4;
                    const len = Math.max(0, w * h * comps);
                    data = new Uint8Array(env.getJNIDataView().buffer, p, len);
                }
                gl.texImage2D(t, l, i, w, h, b, f, ty, data);
            });

            n.Java_org_lwjgl_opengl_GL11_nglTexSubImage2D = noThrow((env, cls, target, level, x, y, width, height, format, type, pixelsPtr) => {
                const gl = ensureGl();
                if (!gl) return;
                const p = toNumber(pixelsPtr);
                const w = toNumber(width), h = toNumber(height), f = toNumber(format), ty = toNumber(type);
                let data = null;
                if (p > 0 && ty === gl.UNSIGNED_BYTE) {
                    const comps = (f === gl.RGB || f === 6407) ? 3 : 4;
                    const len = Math.max(0, w * h * comps);
                    data = new Uint8Array(env.getJNIDataView().buffer, p, len);
                }
                gl.texSubImage2D(toNumber(target), toNumber(level), toNumber(x), toNumber(y), w, h, f, ty, data);
            });

            n.Java_org_lwjgl_opengl_GL11_nglEnableClientState = noThrow(() => { state.vertexArrayEnabled = true; });
            n.Java_org_lwjgl_opengl_GL11_nglDisableClientState = noThrow(() => { state.vertexArrayEnabled = false; });
            n.Java_org_lwjgl_opengl_GL11_nglColorPointer = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglTexCoordPointer = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglVertexPointer = () => {};

            n.Java_org_lwjgl_opengl_GL11_nglDrawArrays = noThrow((env, cls, mode, first, count) => {
                const gl = ensureGl();
                if (!gl || !state.vertexArrayEnabled) return;
                gl.drawArrays(toNumber(mode), toNumber(first), toNumber(count));
            });

            n.Java_org_lwjgl_opengl_GL11_nglFlush = noThrow(() => {
                const gl = ensureGl();

            n.Java_org_lwjgl_opengl_GL11_nglMatrixMode = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglLoadIdentity = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglOrtho = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglTranslatef = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglRotatef = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglScalef = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglPushMatrix = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglPopMatrix = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglPushAttrib = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglPopAttrib = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglShadeModel = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglLineWidth = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglAlphaFunc = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglColorMask = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglColor3f = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglColor4f = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglColor4ub = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglNormal3f = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglLightfv = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglCallList = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglGenLists = () => 1;
            n.Java_org_lwjgl_opengl_GL11_nglNewList = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglEndList = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglBegin = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglEnd = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglTexCoord2f = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglVertex2f = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglVertex3f = () => {};

            return n;
        }

        function createUnsafeFallbackNatives(logFn) {
            const warned = new Set();
            const warnOnce = (name) => {
                if (warned.has(name)) return;
                warned.add(name);
                logFn(`[Unsafe JNI fallback] ${name} bridged via JS fallback`, '#ffaa00');
            };

            const voidFallback = (name) => (..._args) => {
                warnOnce(name);
                return;
            };

            const zeroFallback = (name) => (..._args) => {
                warnOnce(name);
                return 0;
            };

            const falseFallback = (name) => (..._args) => {
                warnOnce(name);
                return false;
            };

            const nullFallback = (name) => (..._args) => {
                warnOnce(name);
                return null;
            };

            const owners = [
                'Java_jdk_internal_misc_Unsafe',
                'Java_sun_misc_Unsafe'
            ];
            const primitives = [
                { name: 'Byte', sig: 'B', ret: 'zero' },
                { name: 'Short', sig: 'S', ret: 'zero' },
                { name: 'Char', sig: 'C', ret: 'zero' },
                { name: 'Int', sig: 'I', ret: 'zero' },
                { name: 'Long', sig: 'J', ret: 'zero' },
                { name: 'Float', sig: 'F', ret: 'zero' },
                { name: 'Double', sig: 'D', ret: 'zero' },
                { name: 'Boolean', sig: 'Z', ret: 'false' }
            ];
            const out = {};

            for (const owner of owners) {
                for (const p of primitives) {
                    const putBase = `${owner}_put${p.name}`;
                    const getBase = `${owner}_get${p.name}`;
                    const ret = p.ret === 'false' ? falseFallback : zeroFallback;

                    out[putBase] = voidFallback(putBase);
                    out[`${putBase}__J${p.sig}`] = voidFallback(`${putBase}__J${p.sig}`);
                    out[`${putBase}__Ljava_lang_Object_2J${p.sig}`] =
                        voidFallback(`${putBase}__Ljava_lang_Object_2J${p.sig}`);
                    out[`${putBase}Volatile`] = voidFallback(`${putBase}Volatile`);
                    out[`${putBase}Volatile__Ljava_lang_Object_2J${p.sig}`] =
                        voidFallback(`${putBase}Volatile__Ljava_lang_Object_2J${p.sig}`);

                    out[getBase] = ret(getBase);
                    out[`${getBase}__J`] = ret(`${getBase}__J`);
                    out[`${getBase}__Ljava_lang_Object_2J`] = ret(`${getBase}__Ljava_lang_Object_2J`);
                    out[`${getBase}Volatile`] = ret(`${getBase}Volatile`);
                    out[`${getBase}Volatile__J`] = ret(`${getBase}Volatile__J`);
                    out[`${getBase}Volatile__Ljava_lang_Object_2J`] =
                        ret(`${getBase}Volatile__Ljava_lang_Object_2J`);
                }

                out[`${owner}_putObject`] = voidFallback(`${owner}_putObject`);
                out[`${owner}_putObject__JLjava_lang_Object_2`] =
                    voidFallback(`${owner}_putObject__JLjava_lang_Object_2`);
                out[`${owner}_putObject__Ljava_lang_Object_2JLjava_lang_Object_2`] =
                    voidFallback(`${owner}_putObject__Ljava_lang_Object_2JLjava_lang_Object_2`);
                out[`${owner}_putObjectVolatile`] = voidFallback(`${owner}_putObjectVolatile`);
                out[`${owner}_putObjectVolatile__Ljava_lang_Object_2JLjava_lang_Object_2`] =
                    voidFallback(`${owner}_putObjectVolatile__Ljava_lang_Object_2JLjava_lang_Object_2`);
                out[`${owner}_getObject`] = nullFallback(`${owner}_getObject`);
                out[`${owner}_getObject__J`] = nullFallback(`${owner}_getObject__J`);
                out[`${owner}_getObject__Ljava_lang_Object_2J`] =
                    nullFallback(`${owner}_getObject__Ljava_lang_Object_2J`);
                out[`${owner}_getObjectVolatile`] = nullFallback(`${owner}_getObjectVolatile`);
                out[`${owner}_getObjectVolatile__J`] =
                    nullFallback(`${owner}_getObjectVolatile__J`);
                out[`${owner}_getObjectVolatile__Ljava_lang_Object_2J`] =
                    nullFallback(`${owner}_getObjectVolatile__Ljava_lang_Object_2J`);

                out[`${owner}_compareAndSetInt`] = falseFallback(`${owner}_compareAndSetInt`);
                out[`${owner}_compareAndSetLong`] = falseFallback(`${owner}_compareAndSetLong`);
                out[`${owner}_compareAndSetReference`] =
                    falseFallback(`${owner}_compareAndSetReference`);
            }

            return out;
        }

        function installLwjglConsoleFilter() {
            if (window.__lwjglConsoleFilterInstalled) return;
            window.__lwjglConsoleFilterInstalled = true;

            const patterns = [
                /^\[LWJGL TRACE\]/,
                /^\[LWJGL STAT\]/,
                /^texParameteri:/,
                /^texImage2D:/,
                /^Patched internalFormat:/,
                /^LWJGL: uploadDataImpl \(sampled\)/,
                /^LWJGL: drawArraysImpl \(sampled\)/,
                /^gl(GetInteger|Disable|Enable|PushAttrib|PopAttrib|PushMatrix|PopMatrix|Color3f|ShaderModel|Fog|Fogi|Fogf|ColorMaterial|ActiveTexture|LineWidth|PolygonOffset)/,
                /^at com\.fs\.graphics\.TextureLoader\./,
                /^at com\.fs\.graphics\.oOoO\./,
                /^at com\.fs\.starfarer\.launcher\.opengl\.GLLauncher\./
            ];
            const textContains = [
                'Unable to make public jdk.internal.ref.Cleaner java.nio.DirectByteBuffer.cleaner() accessible',
                'java.lang.reflect.InaccessibleObjectException: Unable to make public jdk.internal.ref.Cleaner',
                'module java.base does not "opens java.nio" to unnamed module'
            ];

            const shouldDrop = (msg) => {
                if (!msg) return false;
                for (const token of textContains) {
                    if (msg.includes(token)) return true;
                }
                for (const pattern of patterns) {
                    if (pattern.test(msg)) return true;
                }
                return false;
            };

            const wrap = (fn) => (...args) => {
                const text = args.map((x) => String(x)).join(' ');
                if (shouldDrop(text)) return;
                fn.apply(console, args);
            };

            console.log = wrap(console.log.bind(console));
            console.warn = wrap(console.warn.bind(console));
            console.error = wrap(console.error.bind(console));
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.textContent = '⌛ INITIALIZING...';
            setCheerpjDisplayStatus('initializing');

            log('Initializing CheerpJ 4.2 Runtime (Java 8)...', '#00d9ff');
            
            try {
                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                const origin = isLocal ? window.location.origin + '/' : 'https://adybag14-cyber.github.io/';
                const projectPath = isLocal ? 'starsectorquick/' : 'starsectorquick/'; 
                const fullAppPath = `/app/${projectPath}`;
                if (!window.__starsectorFetchRewriteInstalled) {
                    const sourceStubUrl = `${origin}${projectPath}starsector/starsector/data/config/__source_fallback__.java`;
                    const serialStubUrl = `${origin}${projectPath}starsector_serial_stub.txt`;
                    const directoryIndexTargets = new Map([
                        ['/starsector/starsector/data/scripts/plugins', '/starsector/starsector/data/scripts/plugins/index.list'],
                        ['/starsector/starsector/data/scripts/world', '/starsector/starsector/data/scripts/world/index.list'],
                        ['/starsector/starsector/data/weapons', '/starsector/starsector/data/weapons/index.list'],
                        ['/starsector/starsector/data/weapons/proj', '/starsector/starsector/data/weapons/proj/index.list'],
                        ['/starsector/starsector/data/shipsystems/proj', '/starsector/starsector/data/shipsystems/proj/index.list'],
                        ['/starsector/starsector/data/shipsystems/wpn', '/starsector/starsector/data/shipsystems/wpn/index.list'],
                        ['/starsector/starsector/data/hulls', '/starsector/starsector/data/hulls/index.list']
                    ]);

                    const rewriteStarsectorUrl = (value) => {
                        if (!value) return value;
                        let asString = String(value);

                        // Project-pages compatibility: map legacy /starsector/* into /starsectorquick/starsector/*
                        if (!isLocal) {
                            const withOrigin = `${origin}starsector/`;
                            if (asString.startsWith(withOrigin)) {
                                asString = `${origin}${projectPath}${asString.slice(origin.length)}`;
                            } else if (asString.startsWith('/starsector/')) {
                                asString = `/${projectPath}${asString.replace(/^\/+/, '')}`;
                            }
                        }

                        let parsed;
                        try {
                            parsed = new URL(asString, window.location.href);
                        } catch (_err) {
                            return asString;
                        }

                        const pathName = parsed.pathname || '';
                        const lowerPath = pathName.toLowerCase();
                        const canonicalPath = lowerPath.replace(/^\/starsectorquick\//, '/');
                        const hasProjectPrefix = lowerPath.startsWith('/starsectorquick/');

                        // Avoid repeated missing serial-file fetch noise when serial is intentionally omitted.
                        // Use a real static file (not data:) so CheerpJ range checks never fail on live hosts.
                        if (canonicalPath === '/.starsector_serial') {
                            return serialStubUrl;
                        }

                        // Source-probe lookups are best-effort diagnostics; serve a stable stub to avoid 404 spam.
                        if (/\/starsector\/starsector\/.*\.java$/i.test(canonicalPath)) {
                            return sourceStubUrl;
                        }

                        for (const [probePath, replacementPath] of directoryIndexTargets.entries()) {
                            if (canonicalPath === probePath || canonicalPath === `${probePath}/`) {
                                parsed.pathname = `${hasProjectPrefix ? '/starsectorquick' : ''}${replacementPath}`;
                                parsed.search = '';
                                return parsed.toString();
                            }
                        }

                        return parsed.toString();
                    };

                    const nativeFetch = window.fetch.bind(window);
                    window.fetch = (input, init) => {
                        if (typeof input === 'string' || input instanceof URL) {
                            return nativeFetch(rewriteStarsectorUrl(input), init);
                        }
                        if (input && input.url) {
                            const rewritten = rewriteStarsectorUrl(input.url);
                            if (rewritten !== input.url) {
                                return nativeFetch(new Request(rewritten, input), init);
                            }
                        }
                        return nativeFetch(input, init);
                    };

                    if (!window.__starsectorXhrRewriteInstalled) {
                        const nativeOpen = XMLHttpRequest.prototype.open;
                        XMLHttpRequest.prototype.open = function patchedOpen(method, requestUrl, ...rest) {
                            const rewritten = rewriteStarsectorUrl(requestUrl);
                            return nativeOpen.call(this, method, rewritten, ...rest);
                        };
                        window.__starsectorXhrRewriteInstalled = true;
                    }

                    window.__starsectorFetchRewriteInstalled = true;
                    log('Installed Starsector resource URL rewrite layer (fetch + XHR).', '#888');
                }
                
                log(`Environment: ${isLocal ? 'LOCAL' : 'REMOTE'}`, '#888');
                log(`Origin: ${origin}`, '#888');
                log(`App Path: ${fullAppPath}`, '#888');
                if (!window.__DISABLE_LWJGL_CONSOLE_FILTER) {
                    installLwjglConsoleFilter();
                } else {

                const jarCacheBustToken = disableJarCacheBust
                    ? ''
                    : String(explicitJarCacheBust || Date.now());
                const withJarCacheBust = (baseUrl) => {
                    if (!jarCacheBustToken) return baseUrl;
                    const sep = baseUrl.includes('?') ? '&' : '?';
                    return `${baseUrl}${sep}v=${encodeURIComponent(jarCacheBustToken)}`;
                };

                if (jarCacheBustToken) {
                    log(`JAR cache-bust enabled token=${jarCacheBustToken}`, '#888');
                } else {
                    log('JAR cache-bust disabled.', '#888');
                }

                const classPathEntries = jarFiles.map(jar => withJarCacheBust(`${fullAppPath}jars/${jar}`));
                const includeContentRootCp = window.__STARSECTOR_INCLUDE_CONTENTROOT_CP__ === true;
                // Keep directory classpath roots opt-in. They trigger large amounts of
                // class/service probing 404s on GH Pages and are not required for normal
                // Starsector Java 8 launcher flow.
                if (includeContentRootCp) {
                    classPathEntries.push(contentRoot);
                    log('Classpath content root enabled (opt-in).', '#ffaa00');
                }
                // Optional precompiled script classes used by no-markets bootstrap fallback.
                // Keep this opt-in; including it by default can duplicate content roots.
                if (window.__STARSECTOR_ENABLE_SECTORGEN_FALLBACK_CP__ === true) {
                    classPathEntries.push(`${fullAppPath}tmp_compile_sectorgen_check/`);
                }
                if (window.__STARSECTOR_FORCE_CONFIG_CP__ === true) {
                    classPathEntries.push(`${contentRoot}data/config/`);
                    log('Classpath data/config fallback enabled (opt-in).', '#ffaa00');
                }

                // Warm fresh range/etag entries for all runtime JARs to reduce stale If-Range
                // mismatch responses (200 instead of 206) across rapid GitHub Pages deploys.
                try {
                    let ok = 0;
                    let warn = 0;
                    for (const jar of jarFiles) {
                        const rangePrimeUrl = withJarCacheBust(`${origin}${projectPath}jars/${jar}`);
                        const rangePrimeResp = await fetch(rangePrimeUrl, {
                            method: 'GET',
                            headers: { Range: 'bytes=0-0' },
                            cache: 'no-store'
                        });
                        if (rangePrimeResp.status === 206) {
                            ok += 1;
                        } else {
                            warn += 1;
                            log(`Range prime ${rangePrimeResp.status}: ${jar}`, '#ffaa00');
                        }
                    }
                    log(`Range prime summary: ok=${ok} warn=${warn}`, warn ? '#ffaa00' : '#888');
                } catch (e) {
                    log(`Range prime skipped: ${e && e.message ? e.message : e}`, '#ffaa00');
                }

                const finalClassPath = classPathEntries.join(':');
                
                log('Final ClassPath: ' + finalClassPath, '#888');
                setCheerpjDisplayStatus(finalDisplayStatus);

                log('Starting Main Class: Fixer', '#00d9ff');
                await cheerpjRunMain('Fixer', finalClassPath);

            } catch (e) {
                log('Error: ' + e.message, '#ff4444');
                console.error(e);
            }
        });
    </script>
</body>
</html>
