<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>Starsector Web - Campaign Launcher</title>
    <script src='https://cjrtnc.leaningtech.com/4.3/loader.js'></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        #game-container { margin: 20px auto; width: 1024px; height: 768px; border: 2px solid #00d9ff; position: relative; background: #111; }
        #log { background: #111; padding: 15px; height: 250px; overflow-y: auto; text-align: left; font-family: monospace; font-size: 12px; border-left: 4px solid #00ff88; margin-top: 20px; }
        .btn { padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #00d9ff; color: #000; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: #00b8e6; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Starsector Web</h1>
        <p>Running Starsector via CheerpJ 4.3 and WebAssembly on GitHub Pages</p>

        <div style="margin: 20px 0;">
            <button id='startBtn' class="btn">LAUNCH STARSECTOR</button>
        </div>
        <div id='runtime-status' style="margin: 10px 0; color: #888; font-family: monospace;">STATE: waiting</div>

        <div id='game-container'></div>

        <div id='log'>
            <div style="color: #888;">[SYSTEM] Waiting for initialization...</div>
        </div>
    </div>

    <script>
        const __STARSECTOR_ORIGINAL_CONSOLE__ = {
            log: console.log.bind(console),
            warn: console.warn.bind(console),
            error: console.error.bind(console)
        };

        function appendRuntimeLog(message, color = '#fff') {
            const l = document.getElementById('log');
            if (!l) return;
            const entry = document.createElement('div');
            entry.style.color = color;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            l.appendChild(entry);
            while (l.childElementCount > 300) l.removeChild(l.firstElementChild);
            l.scrollTop = l.scrollHeight;
        }

        function log(m, color = '#fff') {
            appendRuntimeLog(m, color);
            __STARSECTOR_ORIGINAL_CONSOLE__.log(m);
        }

        function beginBootTiming() {
            const timing = {
                startEpochMs: Date.now(),
                startPerfMs: performance.now(),
                phases: []
            };
            window.__STARSECTOR_BOOT_TIMING__ = timing;
            markBootPhase('start');
            return timing;
        }

        function markBootPhase(name, detail = '') {
            const timing = window.__STARSECTOR_BOOT_TIMING__;
            if (!timing || !Number.isFinite(timing.startPerfMs)) return;
            if (timing.phases.some(phase => phase.name === name)) return;
            const atMs = performance.now() - timing.startPerfMs;
            const phase = { name: String(name), atMs, detail: detail ? String(detail) : '' };
            timing.phases.push(phase);
            __STARSECTOR_ORIGINAL_CONSOLE__.log(`[boot-timing] phase=${phase.name} ms=${atMs.toFixed(1)}${phase.detail ? ` detail=${phase.detail}` : ''}`);
        }

        // Starsector can emit engine-fatal lines through System.out, which CheerpJ
        // surfaces as console.log rather than console.error. Classify by content,
        // not by browser console level, and tolerate the engine's "Fatal :" spacing.
        const STARSECTOR_FATAL_CONSOLE_PATTERN = /(?:^|\b)fatal\s*:\s*/i;
        function isFatalRuntimeConsoleText(text) {
            const value = String(text || '');
            return STARSECTOR_FATAL_CONSOLE_PATTERN.test(value) ||
                /Fatal campaign bootstrap failure|Fixer: auto campaign aborting|Fixer: exhausted all new-game/i.test(value);
        }

        function markRuntimeFatal(text) {
            const detail = String(text || 'Fatal runtime failure').slice(0, 240);
            const btn = document.getElementById('startBtn');
            updateRuntimeState('fatal', detail);
            if (btn) {
                btn.disabled = false;
                btn.textContent = 'RETRY STARSECTOR';
                btn.setAttribute('data-last-error', detail);
            }
            appendRuntimeLog(detail, '#ff4444');
        }

        function observeRuntimeConsole(message, level = 'log') {
            const text = String(message || '');
            const btn = document.getElementById('startBtn');

            if (isFatalRuntimeConsoleText(text)) {
                markRuntimeFatal(text);
                return;
            }

            if (/CheerpJ runtime preload complete/i.test(text)) markBootPhase('runtime-preload-ready');
            if (/Fixer: build marker/i.test(text)) markBootPhase('fixer-enter');
            if (/Fixer: mirrored core specs into \/files/i.test(text)) markBootPhase('spec-mirror-ready');
            if (/Fixer: rule command preload complete/i.test(text)) markBootPhase('rule-preload-ready');
            if (/Fixer: auto campaign watcher started/i.test(text)) markBootPhase('watcher-started');
            if (/Fixer: StarfarerSettings preload invoked/i.test(text)) markBootPhase('settings-preload-ready');
            if (/Fixer: Global settings api wired/i.test(text)) markBootPhase('settings-api-ready');
            if (/Fixer: graphics init probe completed/i.test(text)) markBootPhase('graphics-probe-ready');
            if (/Fixer: Launch config/i.test(text)) markBootPhase('launch-config-ready');
            if (/Bridge Display\.update\(true\) count=1/i.test(text)) markBootPhase('resource-loader-first-display');
            if (/BrowserResourceLoader: deferred eager ship\/weapon\/projectile sprite preload/i.test(text)) {
                markBootPhase('dynamic-sprite-preload-deferred');
            }
            if (/BrowserSpecCache:\s*ready/i.test(text)) {
                markBootPhase('browser-spec-cache-ready', text);
            }
            if (/BrowserSpecCache:\s*first-hit/i.test(text)) {
                markBootPhase('browser-spec-cache-first-hit', text);
            }
            const resourceLoaderStage = text.match(/BrowserResourceLoaderStage:\s*([a-z0-9-]+)/i);
            if (resourceLoaderStage) {
                markBootPhase(`resource-loader-${resourceLoaderStage[1].toLowerCase()}`);
            }
            const specStoreStage = text.match(/BrowserSpecStoreStage:\s*(\d+):(\d+):(before|after):(.+)$/i);
            if (specStoreStage) {
                markBootPhase(
                    `spec-store-${specStoreStage[2]}-${specStoreStage[3].toLowerCase()}`,
                    specStoreStage[4]
                );
            }

            if (/watcher state=Campaign State|reached Campaign State|Campaign State transition fallback succeeded/i.test(text)) {
                markBootPhase('campaign-state');
                updateRuntimeState('campaign', 'Main campaign view');
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = 'CAMPAIGN RUNNING';
                }
            } else if (/direct new-game init succeeded|campaign transition UI preflight ready/i.test(text)) {
                markBootPhase('direct-new-game-ready');
                updateRuntimeState('campaign-loading', 'Entering campaign');
                if (btn) btn.textContent = 'ENTERING CAMPAIGN...';
            } else if (/direct new-game attempt|synthetic player fleet|minimal fallback market/i.test(text)) {
                markBootPhase('direct-new-game-start');
                updateRuntimeState('campaign-initializing', 'Building campaign');
                if (btn) btn.textContent = 'BUILDING CAMPAIGN...';
            } else if (/watcher state=Title Screen State|reached Title Screen State/i.test(text)) {
                markBootPhase('title-state');
                updateRuntimeState('title', 'Preparing campaign');
                if (btn) btn.textContent = 'PREPARING CAMPAIGN...';
            }

            const important =
                /^Fixer: (auto campaign|direct new-game|Campaign State|created synthetic|.*fallback market)/i.test(text) ||
                /^Bridge Display\.update count=/i.test(text);
            if (important) appendRuntimeLog(text, level === 'error' ? '#ff6666' : level === 'warn' ? '#ffaa00' : '#b7f7ff');
        }

        for (const level of ['log', 'warn', 'error']) {
            console[level] = (...args) => {
                try {
                    const text = args.map(value => value instanceof Error ? (value.stack || value.message) : String(value)).join(' ');
                    // Re-emit engine-fatal System.out/console.log lines through the
                    // real error console so DevTools, CI and users all see an error.
                    const effectiveLevel = isFatalRuntimeConsoleText(text) ? 'error' : level;
                    __STARSECTOR_ORIGINAL_CONSOLE__[effectiveLevel](...args);
                    observeRuntimeConsole(text, effectiveLevel);
                } catch (observerError) {
                    __STARSECTOR_ORIGINAL_CONSOLE__.warn('Runtime console observer failed:', observerError);
                }
            };
        }

        function updateRuntimeState(state, detail = '') {
            const normalized = String(state || 'unknown');
            const detailText = detail ? String(detail) : '';
            const statusText = detailText ? `STATE: ${normalized} | ${detailText}` : `STATE: ${normalized}`;
            const statusEl = document.getElementById('runtime-status');
            if (statusEl) {
                statusEl.textContent = statusText;
            }
            document.documentElement.setAttribute('data-runtime-state', normalized);
            document.body.setAttribute('data-runtime-state', normalized);
            if (detailText) {
                document.documentElement.setAttribute('data-runtime-detail', detailText);
                document.body.setAttribute('data-runtime-detail', detailText);
            } else {
                document.documentElement.removeAttribute('data-runtime-detail');
                document.body.removeAttribute('data-runtime-detail');
            }
            window.__STARSECTOR_RUNTIME_STATE__ = {
                state: normalized,
                detail: detailText,
                at: new Date().toISOString()
            };
        }

        function reportRuntimeFailure(errorLike) {
            const message = errorLike && errorLike.message ? errorLike.message : String(errorLike || 'Unknown runtime error');
            const btn = document.getElementById('startBtn');
            updateRuntimeState('failed', message);
            if (btn) {
                btn.disabled = false;
                btn.textContent = 'RETRY STARSECTOR';
                btn.setAttribute('data-last-error', message);
            }
            log('Runtime failure: ' + message, '#ff4444');
        }

        window.addEventListener('error', (event) => {
            if (event && (event.error || event.message)) {
                reportRuntimeFailure(event.error || event.message);
            }
        });

        window.addEventListener('unhandledrejection', (event) => {
            if (event && event.reason) {
                reportRuntimeFailure(event.reason);
            }
        });

        updateRuntimeState('waiting');

        function createInlineLwjglNatives(logFn) {
            const state = {
                gl: null,
                texById: new Map(),
                nextTexId: 1,
                vertexArrayEnabled: false
            };

            function ensureGl() {
                if (state.gl) return state.gl;
                const canvas = document.querySelector('#game-container canvas') || document.querySelector('canvas');
                if (!canvas) return null;
                state.gl = canvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true }) ||
                           canvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: true });
                if (!state.gl) logFn('Inline LWJGL bridge: failed to acquire WebGL context', '#ff8800');
                return state.gl;
            }

            function toNumber(v) {
                return typeof v === 'bigint' ? Number(v) : v;
            }

            function noThrow(fn) {
                return (...args) => {
                    try { return fn(...args); } catch (e) {
                        console.warn('Inline LWJGL native failed:', e);
                        return undefined;
                    }
                };
            }

            const n = {};

            n.Java_org_lwjgl_Sys_getTimerResolution = () => BigInt(1000);
            n.Java_org_lwjgl_Sys_getTime = () => BigInt(Math.floor(performance.now()));
            n.Java_org_lwjgl_Sys_alert = (env, cls, title, message) => {
                console.warn('[LWJGL ALERT]', String(title), String(message));
            };

            n.Java_org_lwjgl_opengl_Display_create = noThrow(() => {
                ensureGl();
            });
            n.Java_org_lwjgl_opengl_LinuxContextImplementation_nSetSwapInterval = () => {};
            n.Java_org_lwjgl_opengl_LinuxContextImplementation_nMakeCurrent = () => {};
            n.Java_org_lwjgl_opengl_LinuxContextImplementation_nIsCurrent = () => true;
            n.Java_org_lwjgl_opengl_LinuxContextImplementation_nSwapBuffers = () => undefined;

            n.Java_org_lwjgl_opengl_GL11_nglGetString = noThrow((env, cls, name) => {
                const p = toNumber(name);
                if (p === 7938) return '2.1';
                if (p === 7939) return 'GL_EXT_framebuffer_object GL_ARB_vertex_buffer_object';
                return '';
            });

            n.Java_org_lwjgl_opengl_GL11_nglGetIntegerv = noThrow((env, cls, pname, ptr) => {
                const p = toNumber(pname);
                const base = toNumber(ptr);
                const dv = env.getJNIDataView();
                if (p === 2978) {
                    const gl = ensureGl();
                    const w = gl ? gl.drawingBufferWidth : 1024;
                    const h = gl ? gl.drawingBufferHeight : 768;
                    dv.setInt32(base + 0, 0, true);
                    dv.setInt32(base + 4, 0, true);
                    dv.setInt32(base + 8, w, true);
                    dv.setInt32(base + 12, h, true);
                } else {
                    dv.setInt32(base, 0, true);
                }
            });

            n.Java_org_lwjgl_opengl_GL11_nglClearColor = noThrow((env, cls, r, g, b, a) => {
                const gl = ensureGl();
                if (gl) gl.clearColor(r, g, b, a);
            });

            n.Java_org_lwjgl_opengl_GL11_nglClear = noThrow((env, cls, mask) => {
                const gl = ensureGl();
                if (gl) gl.clear(toNumber(mask));
            });

            n.Java_org_lwjgl_opengl_GL11_nglViewport = noThrow((env, cls, x, y, w, h) => {
                const gl = ensureGl();
                if (gl) gl.viewport(toNumber(x), toNumber(y), toNumber(w), toNumber(h));
            });

            n.Java_org_lwjgl_opengl_GL11_nglEnable = noThrow((env, cls, cap) => {
                const gl = ensureGl();
                if (gl) gl.enable(toNumber(cap));
            });

            n.Java_org_lwjgl_opengl_GL11_nglDisable = noThrow((env, cls, cap) => {
                const gl = ensureGl();
                if (gl) gl.disable(toNumber(cap));
            });

            n.Java_org_lwjgl_opengl_GL11_nglBlendFunc = noThrow((env, cls, src, dst) => {
                const gl = ensureGl();
                if (gl) gl.blendFunc(toNumber(src), toNumber(dst));
            });

            n.Java_org_lwjgl_opengl_GL11_nglGenTextures = noThrow((env, cls, count, ptr) => {
                const gl = ensureGl();
                const dv = env.getJNIDataView();
                const c = toNumber(count);
                const base = toNumber(ptr);
                for (let i = 0; i < c; i++) {
                    const id = state.nextTexId++;
                    const tex = gl ? gl.createTexture() : null;
                    state.texById.set(id, tex);
                    dv.setInt32(base + i * 4, id, true);
                }
            });

            n.Java_org_lwjgl_opengl_GL11_nglBindTexture = noThrow((env, cls, target, texture) => {
                const gl = ensureGl();
                if (!gl) return;
                const id = toNumber(texture);
                let tex = state.texById.get(id);
                if (!tex && id > 0) {
                    tex = gl.createTexture();
                    state.texById.set(id, tex);
                }
                gl.bindTexture(toNumber(target), tex || null);
            });

            n.Java_org_lwjgl_opengl_GL11_nglTexParameteri = noThrow((env, cls, target, pname, param) => {
                const gl = ensureGl();
                if (!gl) return;
                gl.texParameteri(toNumber(target), toNumber(pname), toNumber(param));
            });

            n.Java_org_lwjgl_opengl_GL11_nglTexImage2D = noThrow((env, cls, target, level, internalFormat, width, height, border, format, type, pixelsPtr) => {
                const gl = ensureGl();
                if (!gl) return;
                const t = toNumber(target), l = toNumber(level), i = toNumber(internalFormat);
                const w = toNumber(width), h = toNumber(height), b = toNumber(border);
                const f = toNumber(format), ty = toNumber(type), p = toNumber(pixelsPtr);
                let data = null;
                if (p > 0 && ty === gl.UNSIGNED_BYTE) {
                    const comps = (f === gl.RGB || f === 6407) ? 3 : 4;
                    const len = Math.max(0, w * h * comps);
                    data = new Uint8Array(env.getJNIDataView().buffer, p, len);
                }
                gl.texImage2D(t, l, i, w, h, b, f, ty, data);
            });

            n.Java_org_lwjgl_opengl_GL11_nglTexSubImage2D = noThrow((env, cls, target, level, x, y, width, height, format, type, pixelsPtr) => {
                const gl = ensureGl();
                if (!gl) return;
                const p = toNumber(pixelsPtr);
                const w = toNumber(width), h = toNumber(height), f = toNumber(format), ty = toNumber(type);
                let data = null;
                if (p > 0 && ty === gl.UNSIGNED_BYTE) {
                    const comps = (f === gl.RGB || f === 6407) ? 3 : 4;
                    const len = Math.max(0, w * h * comps);
                    data = new Uint8Array(env.getJNIDataView().buffer, p, len);
                }
                gl.texSubImage2D(toNumber(target), toNumber(level), toNumber(x), toNumber(y), w, h, f, ty, data);
            });

            n.Java_org_lwjgl_opengl_GL11_nglEnableClientState = noThrow(() => { state.vertexArrayEnabled = true; });
            n.Java_org_lwjgl_opengl_GL11_nglDisableClientState = noThrow(() => { state.vertexArrayEnabled = false; });
            n.Java_org_lwjgl_opengl_GL11_nglColorPointer = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglTexCoordPointer = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglVertexPointer = () => {};

            n.Java_org_lwjgl_opengl_GL11_nglDrawArrays = noThrow((env, cls, mode, first, count) => {
                const gl = ensureGl();
                if (!gl || !state.vertexArrayEnabled) return;
                gl.drawArrays(toNumber(mode), toNumber(first), toNumber(count));
            });

            n.Java_org_lwjgl_opengl_GL11_nglFlush = noThrow(() => {
                const gl = ensureGl();
                if (gl) gl.flush();
            });

            n.Java_org_lwjgl_opengl_GL11_nglMatrixMode = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglLoadIdentity = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglOrtho = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglTranslatef = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglRotatef = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglScalef = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglPushMatrix = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglPopMatrix = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglPushAttrib = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglPopAttrib = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglShadeModel = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglLineWidth = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglAlphaFunc = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglColorMask = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglColor3f = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglColor4f = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglColor4ub = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglNormal3f = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglLightfv = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglCallList = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglGenLists = () => 1;
            n.Java_org_lwjgl_opengl_GL11_nglNewList = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglEndList = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglBegin = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglEnd = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglTexCoord2f = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglVertex2f = () => {};
            n.Java_org_lwjgl_opengl_GL11_nglVertex3f = () => {};

            return n;
        }

        function createUnsafeFallbackNatives(logFn) {
            const warned = new Set();
            const warnOnce = (name) => {
                if (warned.has(name)) return;
                warned.add(name);
                logFn(`[Unsafe JNI fallback] ${name} bridged via JS fallback`, '#ffaa00');
            };

            const voidFallback = (name) => (..._args) => {
                warnOnce(name);
                return;
            };

            const zeroFallback = (name) => (..._args) => {
                warnOnce(name);
                return 0;
            };

            const falseFallback = (name) => (..._args) => {
                warnOnce(name);
                return false;
            };

            const nullFallback = (name) => (..._args) => {
                warnOnce(name);
                return null;
            };

            const owners = [
                'Java_jdk_internal_misc_Unsafe',
                'Java_sun_misc_Unsafe'
            ];
            const primitives = [
                { name: 'Byte', sig: 'B', ret: 'zero' },
                { name: 'Short', sig: 'S', ret: 'zero' },
                { name: 'Char', sig: 'C', ret: 'zero' },
                { name: 'Int', sig: 'I', ret: 'zero' },
                { name: 'Long', sig: 'J', ret: 'zero' },
                { name: 'Float', sig: 'F', ret: 'zero' },
                { name: 'Double', sig: 'D', ret: 'zero' },
                { name: 'Boolean', sig: 'Z', ret: 'false' }
            ];
            const out = {};

            for (const owner of owners) {
                for (const p of primitives) {
                    const putBase = `${owner}_put${p.name}`;
                    const getBase = `${owner}_get${p.name}`;
                    const ret = p.ret === 'false' ? falseFallback : zeroFallback;

                    out[putBase] = voidFallback(putBase);
                    out[`${putBase}__J${p.sig}`] = voidFallback(`${putBase}__J${p.sig}`);
                    out[`${putBase}__Ljava_lang_Object_2J${p.sig}`] =
                        voidFallback(`${putBase}__Ljava_lang_Object_2J${p.sig}`);
                    out[`${putBase}Volatile`] = voidFallback(`${putBase}Volatile`);
                    out[`${putBase}Volatile__Ljava_lang_Object_2J${p.sig}`] =
                        voidFallback(`${putBase}Volatile__Ljava_lang_Object_2J${p.sig}`);

                    out[getBase] = ret(getBase);
                    out[`${getBase}__J`] = ret(`${getBase}__J`);
                    out[`${getBase}__Ljava_lang_Object_2J`] = ret(`${getBase}__Ljava_lang_Object_2J`);
                    out[`${getBase}Volatile`] = ret(`${getBase}Volatile`);
                    out[`${getBase}Volatile__J`] = ret(`${getBase}Volatile__J`);
                    out[`${getBase}Volatile__Ljava_lang_Object_2J`] =
                        ret(`${getBase}Volatile__Ljava_lang_Object_2J`);
                }

                out[`${owner}_putObject`] = voidFallback(`${owner}_putObject`);
                out[`${owner}_putObject__JLjava_lang_Object_2`] =
                    voidFallback(`${owner}_putObject__JLjava_lang_Object_2`);
                out[`${owner}_putObject__Ljava_lang_Object_2JLjava_lang_Object_2`] =
                    voidFallback(`${owner}_putObject__Ljava_lang_Object_2JLjava_lang_Object_2`);
                out[`${owner}_putObjectVolatile`] = voidFallback(`${owner}_putObjectVolatile`);
                out[`${owner}_putObjectVolatile__Ljava_lang_Object_2JLjava_lang_Object_2`] =
                    voidFallback(`${owner}_putObjectVolatile__Ljava_lang_Object_2JLjava_lang_Object_2`);
                out[`${owner}_getObject`] = nullFallback(`${owner}_getObject`);
                out[`${owner}_getObject__J`] = nullFallback(`${owner}_getObject__J`);
                out[`${owner}_getObject__Ljava_lang_Object_2J`] =
                    nullFallback(`${owner}_getObject__Ljava_lang_Object_2J`);
                out[`${owner}_getObjectVolatile`] = nullFallback(`${owner}_getObjectVolatile`);
                out[`${owner}_getObjectVolatile__J`] =
                    nullFallback(`${owner}_getObjectVolatile__J`);
                out[`${owner}_getObjectVolatile__Ljava_lang_Object_2J`] =

        function installLwjglConsoleFilter() {

                /^\[LWJGL STAT\]/,
                /^texParameteri:/,
                /^texImage2D:/,
                /^Patched internalFormat:/,
                /^LWJGL: uploadDataImpl \(sampled\)/,
                /^LWJGL: drawArraysImpl \(sampled\)/,
                /^gl(GetInteger|Disable|Enable|PushAttrib|PopAttrib|PushMatrix|PopMatrix|Color3f|ShaderModel|Fog|Fogi|Fogf|ColorMaterial|ActiveTexture|LineWidth|PolygonOffset)/,
                /^at com\.fs\.graphics\.TextureLoader\./,
                /^at com\.fs\.graphics\.oOoO\./,
                /^at com\.fs\.starfarer\.launcher\.opengl\.GLLauncher\./
            ];
            const textContains = [
                'Unable to make public jdk.internal.ref.Cleaner java.nio.DirectByteBuffer.cleaner() accessible',
                'java.lang.reflect.InaccessibleObjectException: Unable to make public jdk.internal.ref.Cleaner',
                'module java.base does not "opens java.nio" to unnamed module'
            ];

            const shouldDrop = (msg) => {
                if (!msg) return false;
                for (const token of textContains) {
                    if (msg.includes(token)) return true;
                }
                for (const pattern of patterns) {
                    if (pattern.test(msg)) return true;
                }
                return false;
            };

            const wrap = (fn) => (...args) => {
                const text = args.map((x) => String(x)).join(' ');
                if (shouldDrop(text)) return;
                fn.apply(console, args);
            };

            console.log = wrap(console.log.bind(console));
            console.warn = wrap(console.warn.bind(console));
            console.error = wrap(console.error.bind(console));

                markBootPhase('display-ready');

                // Use stock LWJGL classes by default; opt into loading_patch explicitly.
                const useLoadingPatch = window.__USE_LOADING_PATCH__ === true;
                let jarFiles = [];
                try {
                    const jarIndexUrl = `${siteRootUrl}jars/index.list?ts=${Date.now()}`;
                    const jarIndexResponse = await fetch(jarIndexUrl, { cache: 'no-store' });
                    if (!jarIndexResponse.ok) {
                        throw new Error(`HTTP ${jarIndexResponse.status}`);
                    }
                    const jarIndexText = await jarIndexResponse.text();
                    jarFiles = jarIndexText
                        .split('\n')
                        .map(line => line.trim())
                        .filter(Boolean)
                        .map(line => line.split(/\s+/)[0])
                        .filter(Boolean);
                    log(`Loaded ${jarFiles.length} jar entr${jarFiles.length === 1 ? 'y' : 'ies'} from jars/index.list`, '#888');
                    markBootPhase('jar-index-ready', String(jarFiles.length));
                } catch (jarIndexError) {
                    log(`Jar index load failed; using fallback list (${jarIndexError.message})`, '#ffaa00');
                    jarFiles = [
                        'bridge.jar',
                        'fixer.jar',
                        'resources.jar',
                        'janino.jar',
                        'commons-compiler.jar',
                        'starfarer.api.jar',
                        'starfarer_obf.jar',
                        'jogg-0.0.7.jar',
                        'jorbis-0.0.15.jar',
                        'json.jar',
                        'lwjgl.jar',
                        'jinput.jar',
                        'log4j-1.2.9.jar',
                        'lwjgl_util.jar',
                        'fs.sound_obf.jar',
                        'fs.common_obf.jar',
                        'xstream-1.4.10.jar',
                        'txw2-2.3.1.jar',
                        'starfarer.res.jar',
                        'scripts-precompiled.jar'
                    ];
                }
                jarFiles = [...new Set(jarFiles.filter(Boolean))];
                if (useLoadingPatch && !jarFiles.includes('loading_patch.jar')) {
                    jarFiles.unshift('loading_patch.jar');
                }

                const disableJarCacheBust = window.__STARSECTOR_DISABLE_JAR_CACHE_BUST__ === true;
                const explicitJarCacheBust = window.__STARSECTOR_CLASSPATH_CACHE_BUST__;
                const jarCacheBustToken = disableJarCacheBust
                    ? ''
                    : String(explicitJarCacheBust || Date.now());
                const withJarCacheBust = (baseUrl) => {
                    if (!jarCacheBustToken) return baseUrl;
                    const sep = baseUrl.includes('?') ? '&' : '?';
                    return `${baseUrl}${sep}v=${encodeURIComponent(jarCacheBustToken)}`;
                };

                if (jarCacheBustToken) {
                    log(`JAR cache-bust enabled token=${jarCacheBustToken}`, '#888');
                } else {
                    log('JAR cache-bust disabled.', '#888');
                }

                // Keep the Java classpath itself query-free; Starsector parses resource URLs as paths.
                // The network fetches are still cache-busted by the range-prime step below.
                const classPathEntries = jarFiles.map(jar => `${fullAppPath}jars/${jar}`);
                // Optional sectorgen fallback classes are opt-in because the local repo does not ship them by default.
                if (window.__STARSECTOR_ENABLE_SECTORGEN_FALLBACK_CP__ === true) {
                    classPathEntries.push(`${fullAppPath}tmp_compile_sectorgen_check/`);
                }
                // GitHub Pages returns 404 for directory-style classpath probes. Fixer reads
                // Starsector config through starsector.contentRoot/resource manager instead.
                if (window.__STARSECTOR_INCLUDE_CONFIG_CLASSPATH__ === true) {
                    classPathEntries.push(`${contentRoot}data/config/`);
                }

                // Prime one JAR range first. On Pages, the service worker answers it from the
                // monolithic JAR pack. Verify the pack manifest covers every classpath JAR before
                // declaring the runtime local; otherwise fall back to parallel per-JAR primes.
                const primeJarRange = async (url, cacheMode) => fetch(url, {
                    method: 'GET',
                    headers: { Range: 'bytes=0-0' },
                    cache: cacheMode
                });
                let jarPackReady = false;
                if (jarFiles.length > 0) {
                    try {
                        const firstJarUrl = `${siteRootUrl}jars/${jarFiles[0]}`;
                        const firstResp = await primeJarRange(firstJarUrl, 'reload');
                        const workerVersion = window.__STARSECTOR_ALIAS_WORKER_VERSION__ || '20260813-runtime-jarpack-v8';
                        const manifestResp = await fetch(`${siteRootUrl}starsector-jar-pack-v1.json?sw=${encodeURIComponent(workerVersion)}`, {
                            cache: 'force-cache'
                        });
                        let uncovered = jarFiles.slice();
                        if (manifestResp.ok) {
                            const manifest = await manifestResp.json();
                            const packedJars = manifest && manifest.version === 1 && manifest.jars ? manifest.jars : {};
                            uncovered = jarFiles.filter(jar => !Object.prototype.hasOwnProperty.call(packedJars, jar));
                        }
                        const servedFromPack = firstResp.status === 206
                            && firstResp.headers.get('x-starsectorquick-jar-pack') === 'v1';
                        jarPackReady = servedFromPack && manifestResp.ok && uncovered.length === 0;
                        if (uncovered.length > 0) {
                            log(`JAR pack coverage incomplete: ${uncovered.slice(0, 8).join(', ')}${uncovered.length > 8 ? ` (+${uncovered.length - 8} more)` : ''}`, '#ffaa00');
                        }
                        if (jarPackReady) {
                            log(`JAR pack ready via ${jarFiles[0]}; manifest covers all ${jarFiles.length} classpath JARs.`, '#00ff88');
                            markBootPhase('jar-runtime-ready', `jar-pack:${jarFiles.length}`);
                        }
                    } catch (probeError) {
                        log(`JAR pack probe failed; using parallel fallback: ${probeError && probeError.message ? probeError.message : probeError}`, '#ffaa00');
                    }
                }
                if (!jarPackReady) {
                    const results = await Promise.all(jarFiles.map(async jar => {
                        const baseJarUrl = `${siteRootUrl}jars/${jar}`;
                        try {
                            const response = await primeJarRange(baseJarUrl, 'reload');
                            return { jar, status: response.status };
                        } catch (error) {
                            return { jar, status: 0, error };
                        }
                    }));
                    const ok = results.filter(item => item.status === 206).length;
                    const warn = results.length - ok;
                    for (const item of results.filter(item => item.status !== 206).slice(0, 8)) {
                        log(`Classpath range prime ${item.status || 'failed'}: ${item.jar}`, '#ffaa00');
                    }
                    log(`Parallel range prime fallback: ok=${ok} warn=${warn}`, warn ? '#ffaa00' : '#888');
                    markBootPhase('jar-runtime-ready', `fallback:${ok}/${results.length}`);
                }

                const finalClassPath = classPathEntries.join(':');

                log('Final ClassPath: ' + finalClassPath, '#888');

                log('Starting Main Class: Fixer', '#00d9ff');
                markBootPhase('run-main-start');
                updateRuntimeState('running', 'Fixer');
                await cheerpjRunMain('Fixer', finalClassPath);
                updateRuntimeState('main-returned', 'Fixer returned');
                btn.textContent = 'RELAUNCH STARSECTOR';
                btn.disabled = false;

            } catch (e) {
                reportRuntimeFailure(e);
                console.error(e);
            } finally {
                window.__STARSECTOR_STARTING__ = false;
            }
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            void startGame();
        });

        const launchParams = new URLSearchParams(window.location.search);
        const shouldAutostart = launchParams.get('manual') !== '1' && launchParams.get('autostart') !== '0';
        if (shouldAutostart) {
            setTimeout(() => {
                log('Autostarting campaign launcher.', '#888');
                void startGame();
            }, 50);
        }
    </script>
</body>
</html>
