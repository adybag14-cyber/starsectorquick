<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>Starsector 2 - GitHub Pages Deployment</title>
    <script src='https://cjrtnc.leaningtech.com/4.2/loader.js' crossorigin></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        #game-container { margin: 20px auto; width: 1024px; height: 768px; border: 2px solid #00d9ff; position: relative; background: #111; }
        #log { background: #111; padding: 15px; height: 250px; overflow-y: auto; text-align: left; font-family: monospace; font-size: 12px; border-left: 4px solid #00ff88; margin-top: 20px; }
        .btn { padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #00d9ff; color: #000; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: #00b8e6; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Starsector 2 Web Edition</h1>
        <p>Running Java via CheerpJ & WebAssembly on GitHub Pages</p>
        
        <div style="margin: 20px 0;">
            <button id='startBtn' class="btn">🚀 LAUNCH STARSECTOR</button>
        </div>

        <div id='game-container'></div>
        
        <div id='log'>
            <div style="color: #888;">[SYSTEM] Waiting for initialization...</div>
        </div>
    </div>

    <script>
        function log(m, color = '#fff') {
            const l = document.getElementById('log');
            if (l) {
                const entry = document.createElement('div');
                entry.style.color = color;
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${m}`;
                l.appendChild(entry);
                l.scrollTop = l.scrollHeight;
            }
            console.log(m);
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.textContent = '⌛ INITIALIZING...';

            log('Initializing CheerpJ 4.2 Runtime...', '#00d9ff');
            
            try {
                const baseUrl = window.location.href.split(/[?#]/)[0].replace(/[^\/]*$/, '');
                log(`Base URL: ${baseUrl}`, '#888');

                await cheerpjInit({ 
                    version: 8, 
                    enableX11: true,
                    javaProperties: [
                        `-Djava.library.path=${baseUrl}build/final/wasm-modules/`,
                        `-Duser.dir=/app/starsector/starsector/`,
                        `-Dcom.fs.starfarer.settings.linux=true`,
                        `-Dorg.lwjgl.opengl.Display.allowSoftwareOpenGL=true`
                    ],
                    libraries: {
                        'libGL.so.1': `${baseUrl}build/final/wasm-modules/gl4es.wasm`,
                        'liblwjgl.so': `${baseUrl}build/final/wasm-modules/lwjgl.js`,
                        'liblwjgl64.so': `${baseUrl}build/final/wasm-modules/lwjgl.js`,
                        'libsun_misc_Unsafe.so': `${baseUrl}build/final/wasm-modules/unsafe.wasm`
                    }
                });

                log('Mounting Display to Canvas...', '#00ff88');
                cheerpjCreateDisplay(1024, 768, document.getElementById('game-container'));

                const jarFiles = [
                    'starfarer_obf.jar', 'starfarer.api.jar', 'fs.common_obf.jar', 
                    'fs.sound_obf.jar', 'commons-compiler.jar', 'janino.jar', 
                    'jinput.jar', 'jogg-0.0.7.jar', 'jorbis-0.0.15.jar',
                    'json.jar', 'log4j-1.2.9.jar', 'lwjgl.jar', 'lwjgl_util.jar',
                    'xstream-1.4.10.jar'
                ];
                
                // Use FULL HTTP URLs for JARs
                const cp = jarFiles.map(j => `${baseUrl}jars/${j}`).join(':') + `:${baseUrl}starsector/starsector/`;

                log('Starting Main Class: com.fs.starfarer.Starfarer', '#ff9f43');
                btn.textContent = '🚀 RUNNING';
                
                await cheerpjRunMain('com.fs.starfarer.Starfarer', cp, '-nosound');
                
                log('Execution loop started. Watch for Java output.', '#00ff88');
            } catch (e) {
                log(`CRITICAL ERROR: ${e.message}`, '#ff4444');
                console.error(e);
                btn.disabled = false;
                btn.textContent = '❌ RETRY LAUNCH';
            }
        });

        log('Welcome to Starsector Web Edition. System ready.');
    </script>
</body>
</html>
